<!doctype html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#061428"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="gc-staff-core" content="1">
<title>Globall Cloud — Staff Command Center</title>
<link rel="icon" type="image/png" href="logo-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#020914;--panel:#081b31;--panel2:#0d2a49;--line:#214d75;--text:#f6fbff;--muted:#9db6d3;--cyan:#16c7e5;--cyan2:#8beaf6;--mint:#58e6b0;--amber:#ffd37a;--danger:#ff6b7a;--shadow:0 24px 70px rgba(0,0,0,.4);--font:'Vazirmatn',sans-serif;--mono:'JetBrains Mono',monospace}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(ellipse 800px 500px at 92% -8%,rgba(22,199,229,.15),transparent 68%),radial-gradient(ellipse 600px 460px at 0 45%,rgba(255,211,122,.06),transparent 70%),var(--bg);color:var(--text);font-family:var(--font)}body{padding:12px}button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer}a{text-decoration:none;color:inherit}.hidden{display:none!important}.shell{width:min(1480px,100%);margin:auto;display:grid;grid-template-columns:250px minmax(0,1fr);gap:14px;min-height:calc(100vh - 24px)}
.sidebar{position:sticky;top:12px;height:calc(100vh - 36px);background:linear-gradient(180deg,rgba(11,35,60,.98),rgba(4,15,28,.98));border:1px solid rgba(126,195,232,.15);border-radius:24px;box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;overflow:auto}.brand{padding:8px 7px 15px;border-bottom:1px solid rgba(126,195,232,.12);margin-bottom:10px}.brand-row{display:flex;align-items:center;gap:10px}.logo{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(145deg,#fff0b0,#db9a36 58%,#9c5c1c);color:#171006;font-weight:900;box-shadow:0 0 0 1px rgba(255,230,163,.3)}.brand b{font-size:17px}.brand small{display:block;color:var(--muted);margin-top:4px;font-size:11px}.nav{display:grid;gap:5px}.nav-item{width:100%;border:1px solid transparent;background:transparent;color:#cfe1f3;border-radius:14px;padding:11px 12px;display:flex;align-items:center;gap:10px;text-align:right;font-weight:800;transition:.18s}.nav-item:hover{background:rgba(255,255,255,.04);border-color:rgba(126,195,232,.12)}.nav-item.active{background:linear-gradient(135deg,rgba(22,199,229,.2),rgba(255,211,122,.08));border-color:rgba(139,234,246,.22);color:#fff}.nav-item span{width:26px;color:var(--cyan2);font-family:var(--mono)}.nav-item b{margin-inline-start:auto;color:var(--amber);font:700 10px var(--mono)}.side-foot{margin-top:auto;padding-top:12px;border-top:1px solid rgba(126,195,232,.12);color:var(--muted);font-size:11px;line-height:1.8}.side-foot strong{color:var(--text);display:block;font-size:13px}.side-foot .branch{color:var(--cyan2);font-family:var(--mono)}
main{min-width:0}.topbar{position:sticky;top:12px;z-index:10;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;margin-bottom:14px;background:rgba(4,15,28,.88);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(126,195,232,.12);border-radius:20px}.top-title{min-width:0}.top-title strong{display:block;font-size:18px}.top-title small{color:var(--muted);font-size:11px}.top-actions{display:flex;gap:8px;flex-wrap:wrap}.btn{min-height:42px;padding:10px 14px;border-radius:12px;border:1px solid rgba(126,195,232,.18);background:rgba(255,255,255,.035);color:var(--text);font-weight:800}.btn:hover{border-color:rgba(139,234,246,.4)}.btn.primary{border:0;background:linear-gradient(135deg,#8beaf6,#16c7e5);color:#03151b}.btn.danger{border-color:rgba(255,107,122,.35);color:#ffd6dc}.btn.tiny{min-height:34px;padding:7px 10px;font-size:11px}
.status{padding:8px 11px;border-radius:999px;border:1px solid rgba(88,230,176,.3);background:rgba(88,230,176,.08);color:#b9f6df;font:700 10px var(--mono);white-space:nowrap}.status[data-kind=bad]{border-color:rgba(255,107,122,.3);background:rgba(255,107,122,.08);color:#ffd0d6}.status[data-kind=loading]{color:var(--amber);border-color:rgba(255,211,122,.25);background:rgba(255,211,122,.07)}
.view{background:linear-gradient(150deg,rgba(12,41,69,.93),rgba(3,13,24,.98));border:1px solid rgba(126,195,232,.13);border-radius:24px;box-shadow:var(--shadow);padding:18px;min-height:calc(100vh - 115px)}.section-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:18px}.kicker{color:var(--cyan2);font:700 10px var(--mono);letter-spacing:2px}.section-head h2{margin:6px 0 4px;font-size:25px;letter-spacing:-.02em}.section-head p{margin:0;color:var(--muted);line-height:1.8;font-size:13px}.head-actions{display:flex;gap:8px;flex-wrap:wrap}
.metrics-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:16px}.metric{position:relative;overflow:hidden;padding:16px;border:1px solid rgba(126,195,232,.13);border-radius:18px;background:linear-gradient(160deg,rgba(16,49,82,.85),rgba(5,20,37,.94))}.metric:after{content:'';position:absolute;inset-inline-end:-30px;top:-30px;width:90px;height:90px;border-radius:50%;background:radial-gradient(circle,rgba(139,234,246,.12),transparent 68%)}.metric span{display:block;color:var(--muted);font-size:11px}.metric strong{display:block;margin:7px 0 5px;font:900 23px var(--mono);color:var(--cyan2);word-break:break-word}.metric small{color:#87a6c5;font-size:10px}
.dashboard-grid{display:grid;grid-template-columns:1.25fr .75fr;gap:12px}.card{border:1px solid rgba(126,195,232,.13);border-radius:19px;background:rgba(255,255,255,.025);padding:16px}.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.card-head h3{margin:0;font-size:15px}.muted{color:var(--muted)}.live{color:var(--mint);font:700 10px var(--mono)}.quick-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.quick{border:1px solid rgba(126,195,232,.12);background:linear-gradient(160deg,rgba(13,44,75,.8),rgba(5,20,37,.9));border-radius:15px;text-align:right;padding:14px;color:#eef7ff;font-weight:800}.quick span{display:block;margin-top:4px;color:var(--muted);font-size:11px;font-weight:500}.health-list{display:grid;gap:9px}.health-list>div{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 12px;border-radius:13px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06)}.ok,.warn,.bad,.pill{display:inline-flex;align-items:center;padding:5px 9px;border-radius:999px;font-size:10px;font-weight:900}.ok{background:rgba(88,230,176,.12);color:#9af2c9}.warn{background:rgba(255,211,122,.12);color:#ffd98c}.bad{background:rgba(255,107,122,.11);color:#ffbbc3}.pill{background:rgba(139,234,246,.1);color:var(--cyan2)}
.table-wrap{overflow:auto;border:1px solid rgba(255,255,255,.07);border-radius:16px}.table-wrap table{width:100%;min-width:800px;border-collapse:collapse}.table-wrap th,.table-wrap td{padding:12px 11px;text-align:right;vertical-align:top;border-bottom:1px solid rgba(255,255,255,.06)}.table-wrap th{background:rgba(255,255,255,.03);color:#b9d5ef;font:700 10px var(--mono)}.table-wrap td{font-size:12px}.table-wrap tr:hover td{background:rgba(255,255,255,.02)}.mono{font-family:var(--mono);font-size:11px}.empty{padding:45px 20px;text-align:center;border:1px dashed rgba(126,195,232,.18);border-radius:17px;color:var(--muted)}.empty strong{display:block;color:var(--text);margin-bottom:5px}.notice{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:14px;border:1px solid rgba(126,195,232,.12);border-radius:16px;background:rgba(255,255,255,.025);margin-bottom:9px}.notice.unread{border-color:rgba(22,199,229,.28);box-shadow:inset 3px 0 0 var(--cyan)}.notice p{margin:5px 0;color:var(--muted);line-height:1.7;font-size:12px}.notice small{color:#7e9bb8}
.chat-layout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:12px}.room-list{display:grid;gap:7px;align-content:start}.room{position:relative;text-align:right;border:1px solid rgba(126,195,232,.1);background:rgba(255,255,255,.025);border-radius:14px;padding:12px;color:var(--text)}.room.active{border-color:rgba(22,199,229,.35);background:rgba(22,199,229,.08)}.room b,.room span{display:block}.room span{margin-top:3px;color:var(--muted);font-size:10px}.room em{position:absolute;inset-inline-start:10px;top:10px;font-style:normal;color:var(--amber);font:700 10px var(--mono)}.chat-card{min-width:0;border:1px solid rgba(126,195,232,.12);border-radius:18px;background:rgba(0,0,0,.12);padding:14px}.messages{display:grid;gap:8px;max-height:430px;overflow:auto;padding:4px}.message{max-width:82%;padding:9px 11px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06)}.message.me{margin-inline-start:auto;background:rgba(22,199,229,.09);border-color:rgba(22,199,229,.2)}.message b{font-size:10px;color:var(--cyan2)}.message p{margin:4px 0;line-height:1.7;font-size:12px;white-space:pre-wrap}.message small{color:#7897b4;font-size:9px}.composer{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:10px}.field{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:#04111f;outline:none}.field:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(22,199,229,.1)}textarea.field{min-height:90px;resize:vertical}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.68);display:grid;place-items:center;padding:16px;z-index:99}.modal{width:min(560px,100%);padding:18px;border-radius:21px;background:#071727;border:1px solid rgba(139,234,246,.2);box-shadow:0 30px 90px rgba(0,0,0,.5);display:grid;gap:10px}.modal label{font-size:12px;color:var(--muted);font-weight:800}.modal .field{display:block;margin-top:6px}.icon-btn{border:1px solid rgba(255,255,255,.1);background:transparent;color:#fff;border-radius:10px;width:34px;height:34px}
.gate{min-height:100vh;display:grid;place-items:center}.gate-card{width:min(480px,100%);padding:26px;border-radius:24px;background:linear-gradient(160deg,#0b2846,#051522);border:1px solid rgba(139,234,246,.18);box-shadow:var(--shadow)}.gate-card h1{margin:8px 0 5px;font-size:29px}.gate-card p{color:var(--muted);font-size:13px;line-height:1.8}.gate-error{min-height:22px;color:#ffbdc5;font-size:12px}.gate .btn{width:100%;margin-top:5px}
@media(max-width:1000px){.shell{grid-template-columns:1fr}.sidebar{position:static;height:auto}.nav{display:flex;overflow:auto;padding-bottom:2px}.nav-item{width:auto;flex:0 0 auto}.side-foot{display:none}.dashboard-grid{grid-template-columns:1fr}}
@media(max-width:720px){body{padding:8px}.topbar{position:static;align-items:flex-start;flex-direction:column}.top-actions{width:100%}.top-actions .btn,.top-actions .status{flex:1;text-align:center;justify-content:center}.metrics-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.quick-grid{grid-template-columns:repeat(2,1fr)}.chat-layout{grid-template-columns:1fr}.room-list{display:flex;overflow:auto}.room{min-width:200px}.composer{grid-template-columns:1fr}.view{padding:13px}}
@media(max-width:460px){.metrics-grid{grid-template-columns:1fr 1fr}.quick-grid{grid-template-columns:1fr}.top-title strong{font-size:16px}.section-head h2{font-size:21px}}
:focus-visible{outline:3px solid var(--cyan2);outline-offset:3px}
</style>

<body>
<div id="loginGate" class="gate hidden"><div class="gate-card"><div class="brand-row"><div class="logo">GC</div><div><div class="kicker">GLOBAL CLOUD</div><h1>Staff Command Center</h1></div></div><p>تەنها بۆ ستافی پشتڕاستکراوە. هەژماری staff ـەکەت لە Supabase Auth ـەوە بە شێوەی پارێزراو دەپشکنرێت.</p><div id="loginError" class="gate-error"></div><form id="loginForm"><input id="email" class="field" type="email" autocomplete="username" placeholder="ئیمەیڵ" required><input id="password" class="field" type="password" autocomplete="current-password" placeholder="وشەی نهێنی" required><button class="btn primary" type="submit">چوونەژوورەوە بۆ Staff OS →</button></form></div></div>
<div id="app" class="hidden"><div class="shell"><aside class="sidebar"><div class="brand"><div class="brand-row"><div class="logo">GC</div><div><b>Globall Cloud</b><small>Staff Command Center</small></div></div></div><nav id="nav" class="nav" aria-label="Staff navigation"></nav><div class="side-foot"><strong id="staffName">—</strong><span id="staffRole">—</span><div id="staffBranch" class="branch">—</div></div></aside><main><header class="topbar"><div class="top-title"><strong id="pageTitle">Staff Command Center</strong><small id="pageSubtitle">Operational workspace</small></div><div class="top-actions"><span id="systemStatus" class="status" data-kind="loading">SYSTEM: CHECKING</span><button id="refreshBtn" class="btn tiny" type="button">نوێکردنەوە</button><button id="logoutBtn" class="btn danger tiny" type="button">چوونەدەرەوە</button></div></header><section id="view" class="view"></section></main></div></div>
