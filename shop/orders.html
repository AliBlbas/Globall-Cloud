<!doctype html><html lang="ku" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Orders | Global Cloud</title><link rel="stylesheet" href="/assets/css/style.css"></head><body><main class="container" style="max-width:1000px;margin:40px auto;padding:24px"><h1>📋 My Orders</h1><div id="ordersList">Loading...</div></main><script type="module">import '/assets/js/auth-guard.js';import {supabase} from '/assets/js/supabase.js';import {initLayout} from '/assets/js/layout.js';await initLayout('orders');const list=document.getElementById('ordersList');const {data:orders,error}=await supabase.from('shopping_orders').select('*, shopping_order_items(*), shipments(id,tracking_number), payment_sessions(status)').order('created_at',{ascending:false});if(error){list.textContent='نەتوانرا order ـەکان بار بکرێن.';}else if(!orders?.length){list.textContent='هێشتا هیچ order ـێکت نییە.';}else{list.innerHTML=orders.map(o=>{const item=o.shopping_order_items?.[0];const safeUrl=item?.product_url||'#';return `<article class="order-card" style="padding:18px;margin:12px 0"><strong>Order #${o.id.slice(0,8)}</strong><div>Status: ${o.status}</div><div>Final: ${Number(o.final_price_iqd||0).toLocaleString()} IQD</div><div><a href="${safeUrl}" target="_blank" rel="noopener">Product</a></div>${o.shipment_id?`<a href="/tracking.html?id=${encodeURIComponent(o.shipment_id)}">📍 Tracking: ${o.shipments?.tracking_number||'View tracking'}</a>`:'<span>📦 چاوەڕێی shipment ـە.</span>'}</article>`}).join('');}</script></body></html>
