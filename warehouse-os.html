<!doctype html><html lang="ckb" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Globall Cloud — Warehouse OS</title><link rel="icon" href="logo-icon.png"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#061428;color:#f5f9fd;font:15px/1.7 system-ui,-apple-system,sans-serif}*{box-sizing:border-box}.wrap{max-width:1200px;margin:auto;padding:18px}.top{position:sticky;top:0;background:rgba(6,20,40,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid #214363}.topin{min-height:68px;display:flex;justify-content:space-between;align-items:center}.brand{display:flex;gap:10px;align-items:center;color:inherit;text-decoration:none}.brand img{width:38px}.brand small{display:block;color:#92aac7;font-size:10px}.btn,.field{font:inherit}.btn{border:1px solid #214363;border-radius:999px;padding:10px 15px;min-height:44px;background:#0d2039;color:#f5f9fd;font-weight:800}.btn.primary{background:linear-gradient(135deg,#58e5ef,#00c2d9);color:#06222a;border:0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.grid2{display:grid;grid-template-columns:1fr 1.4fr;gap:12px}.card{background:linear-gradient(180deg,#112b49,#0d2039);border:1px solid #214363;border-radius:20px;padding:18px}.kpi b{display:block;font:800 28px ui-monospace,monospace}.muted{color:#92aac7}.field{width:100%;background:#0a1a30;color:#f5f9fd;border:1px solid #214363;border-radius:13px;padding:12px;margin-bottom:10px}.list{display:grid;gap:9px}.item{padding:12px;border:1px solid #214363;border-radius:14px;background:rgba(255,255,255,.02)}.row{display:flex;justify-content:space-between;gap:10px}.pill{padding:5px 9px;border-radius:999px;border:1px solid #214363;font-size:11px}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}}@media(max-width:600px){.grid{grid-template-columns:1fr}.field{font-size:16px}}</style></head><body><header class="top"><div class="wrap topin"><a class="brand" href="/"><img src="logo-icon.png"><span><b>Globall Cloud</b><small>WAREHOUSE OS</small></span></a><button id="refresh" class="btn">↻ نوێکردنەوە</button></div></header><main class="wrap"><section style="margin:20px 0"><div class="card"><div class="muted">WAREHOUSE CONTROL</div><h1>وەرگرتن و کۆنتڕۆڵی کۆگا</h1><p class="muted">Batch، location، customer، photo evidence و consolidation لە یەک workflow ـی ستاف.</p></div></section><section class="grid"><div class="card kpi"><span class="muted">Receipts</span><b id="rCount">—</b></div><div class="card kpi"><span class="muted">Consolidated</span><b id="cCount">—</b></div><div class="card kpi"><span class="muted">Today</span><b id="tCount">—</b></div><div class="card kpi"><span class="muted">Staff</span><b id="sName">—</b></div></section><section class="grid2" style="margin-top:14px"><div class="card"><h2>Receipt ـی نوێ</h2><input id="batch" class="field" placeholder="Batch code"><input id="location" class="field" placeholder="Warehouse location"><input id="phone" class="field" placeholder="Customer phone"><textarea id="notes" class="field" rows="4" placeholder="Notes"></textarea><button id="save" class="btn primary" style="width:100%">+ تۆمارکردنی وەرگرتن</button><div id="msg" class="muted" style="margin-top:8px"></div></div><div class="card"><div class="row"><h2>Recent receipts</h2><input id="search" class="field" style="max-width:250px;margin:0" placeholder="Batch / location"></div><div id="list" class="list"><div class="muted">Loading…</div></div></div></section></main><script>const URL='https://ahslifnthiwfkmaswjno.supabase.co',KEY='sb_publishable_M4UtzEbCLwMCd9LanFWw5g_5b7-fWda',sb=supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}),$=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let rows=[],staff=false;async function boot(){const {data:{session}}=await sb.auth.getSession();if(!session){$('list').innerHTML='<div class="item">پێویستە staff login بکرێت.</div>';return}const st=await sb.from('staff').select('full_name,role,is_active').eq('id',session.user.id).maybeSingle();staff=!!st.data&&st.data.is_active!==false;if(!staff){$('list').innerHTML='<div class="item">دەستڕاگەیشتن بۆ Warehouse OS نییە.</div>';return}$('sName').textContent=st.data.full_name||st.data.role||'Staff';await load()}async function load(){const {data,error}=await sb.from('warehouse_receipts').select('id,batch_code,location,received_at,created_by_name,consolidated,directory_phone,notes').order('received_at',{ascending:false}).limit(60);if(error){console.error(error);return}rows=data||[];$('rCount').textContent=rows.length;$('cCount').textContent=rows.filter(x=>x.consolidated).length;$('tCount').textContent=rows.filter(x=>x.received_at&&new Date(x.received_at).toDateString()===new Date().toDateString()).length;render()}function render(){const q=($('search').value||'').toLowerCase();const view=rows.filter(x=>!q||[x.batch_code,x.location,x.directory_phone].some(v=>String(v||'').toLowerCase().includes(q)));$('list').innerHTML=view.map(x=>`<div class="item"><div class="row"><strong>${esc(x.batch_code||'—')}</strong><span class="pill">${x.consolidated?'Consolidated':'Open'}</span></div><div class="muted">${esc(x.location||'—')} · ${x.received_at?new Date(x.received_at).toLocaleString():'—'}</div><small>${esc(x.created_by_name||'Staff')} · ${esc(x.directory_phone||'')}</small></div>`).join('')||'<div class="item">هیچ receipt ـێک نییە.</div>'}$('search').oninput=render;$('refresh').onclick=load;$('save').onclick=async()=>{if(!staff)return;$('msg').textContent='...';const {data:{user}}=await sb.auth.getUser();const {error}=await sb.from('warehouse_receipts').insert({batch_code:$('batch').value.trim()||null,location:$('location').value.trim()||null,directory_phone:$('phone').value.trim()||null,notes:$('notes').value.trim()||null,created_by:user.id,created_by_name:$('sName').textContent,received_at:new Date().toISOString(),consolidated:false});$('msg').textContent=error?error.message:'بە سەرکەوتوویی تۆمار کرا';if(!error){$('batch').value='';$('location').value='';$('phone').value='';$('notes').value='';load()}};boot()</script></body></html>
