name: Supabase public-quote Deploy

on:
  push:
    branches:
      - Product
    paths:
      - "supabase/functions/public-quote/**"
      - "supabase/functions/_shared/**"
      - ".github/workflows/supabase-public-quote-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-public-quote-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Validate repository before public-quote deployment
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install locked validation dependencies
        run: npm ci --ignore-scripts

      - name: Repository validation
        run: npm test

      - name: Production contract validation
        run: npm run test:contracts

      - name: Production and security validation
        run: bash scripts/validate-production.sh

      - name: Asset integrity validation
        run: python3 scripts/validate-assets.py

  deploy:
    name: Deploy public-quote to Supabase
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SUPABASE_PROJECT_REF: ahslifnthiwfkmaswjno
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Require Supabase deployment credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || {
            echo "Missing repository secret SUPABASE_ACCESS_TOKEN. Add a Supabase Personal Access Token with function deployment permission." >&2
            exit 1
          }

      - name: Deploy public-quote
        run: npx --yes supabase@2.58.5 functions deploy public-quote --project-ref "$SUPABASE_PROJECT_REF" --token "$SUPABASE_ACCESS_TOKEN"

      - name: Confirm deployed function endpoint
        run: |
          echo "public-quote: https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/public-quote"
