name: Verify Live Supabase Reference

on:
  push:
    branches: [Product]
  pull_request:
    branches: [Product]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-supabase-reference-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v7 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Verify production project is pinned
        shell: bash
        run: |
          set -euo pipefail
          test "$(grep -E '^project_id[[:space:]]*=' supabase/config.toml | head -n1 | sed -E 's/.*=[[:space:]]*\"([^\"]+)\".*/\1/')" = "ahslifnthiwfkmaswjno"
          stale='swptm''hhwhdtyrrfzetam'
          if grep -RIl "$stale" --include='*.js' --include='*.mjs' --include='*.ts' --include='*.tsx' --include='*.html' --include='*.css' --include='*.json' --include='*.toml' --include='*.yml' --include='*.yaml' .; then
            echo 'Forbidden stale Supabase project reference detected in runtime/config files.'
            exit 1
          fi
          grep -RIl 'ahslifnthiwfkmaswjno.supabase.co' --include='*.js' --include='*.mjs' --include='*.ts' --include='*.tsx' --include='*.html' --include='*.css' --include='*.json' --include='*.toml' --include='*.yml' --include='*.yaml' . >/dev/null
      - name: Validate production contracts
        run: npm run test:contracts
      - name: Validate application
        run: |
          npm ci --ignore-scripts
          npm test
