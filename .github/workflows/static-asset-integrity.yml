name: Static Asset Integrity

on:
  pull_request:
    paths:
      - 'sw.js'
      - 'gc-csp-scripts/**'
      - '*.html'
      - 'scripts/verify-static-assets.mjs'
      - '.github/workflows/static-asset-integrity.yml'
  push:
    branches: [main]
    paths:
      - 'sw.js'
      - 'gc-csp-scripts/**'
      - '*.html'
      - 'scripts/verify-static-assets.mjs'
      - '.github/workflows/static-asset-integrity.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/verify-static-assets.mjs
