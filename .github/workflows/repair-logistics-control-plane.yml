name: One-shot repair — logistics control plane

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-logistics-control-plane.yml'
      - 'supabase/functions/logistics-control-plane/index.ts'

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch secret-key resolution and CORS
        shell: python
        run: |
          from pathlib import Path

          path = Path('supabase/functions/logistics-control-plane/index.ts')
          source = path.read_text(encoding='utf-8')

          old_service = """const serviceClient = () => {
            const url = Deno.env.get('SUPABASE_URL')
            const secret = Deno.env.get('SUPABASE_SERVICE_ROLE_KEY') || Deno.env.get('SUPABASE_SECRET_KEY')
            if (!url || !secret) throw new Error('Supabase service configuration is unavailable')
            return createClient(url, secret, {
              auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false },
            })
          }
          """

          new_service = """const resolveServiceKey = () => {
            const direct = Deno.env.get('SUPABASE_SERVICE_ROLE_KEY')
            if (direct) return direct
            const raw = Deno.env.get('SUPABASE_SECRET_KEYS')
            if (!raw) return null
            try {
              const parsed = JSON.parse(raw)
              if (typeof parsed === 'string') return parsed
              if (parsed?.default) return String(parsed.default)
              const first = Object.values(parsed ?? {})[0]
              return first ? String(first) : null
            } catch {
              return null
            }
          }

          const serviceClient = () => {
            const url = Deno.env.get('SUPABASE_URL')
            const secret = resolveServiceKey()
            if (!url || !secret) throw new Error('Supabase service configuration is unavailable')
            return createClient(url, secret, {
              auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false },
            })
          }
          """

          if old_service not in source:
              raise SystemExit('Expected serviceClient block was not found; aborting safely.')
          source = source.replace(old_service, new_service, 1)

          old_headers = "'Access-Control-Allow-Headers': 'authorization, apikey, content-type, x-client-info, x-idempotency-key',"
          new_headers = "'Access-Control-Allow-Headers': 'authorization, apikey, content-type, x-client-info, x-idempotency-key, x-supabase-auth-token, traceparent, tracestate, baggage',"
          if old_headers not in source:
              raise SystemExit('Expected CORS header block was not found; aborting safely.')
          source = source.replace(old_headers, new_headers, 1)

          path.write_text(source, encoding='utf-8')

      - name: Remove one-shot workflow
        shell: bash
        run: rm -f .github/workflows/repair-logistics-control-plane.yml

      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/logistics-control-plane/index.ts .github/workflows/repair-logistics-control-plane.yml
          git diff --cached --quiet && exit 0
          git commit -m 'fix: align control-plane Supabase secret key resolution'
          git push origin HEAD:main
