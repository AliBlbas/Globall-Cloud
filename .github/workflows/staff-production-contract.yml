name: Staff Production Contract

# Manual-only while GitHub-hosted runner capacity is unavailable.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify Staff OS production contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:contracts
      - name: Validate Staff OS files and contracts
        shell: bash
        run: |
          set -euo pipefail
          for file in staff-os-v5.html staff-os-v5.css staff-os-v5.js staff-os-v5-shipment-create-fix.js staff-os-v5-shipment-control-bridge.js staff-os-data-health-panel.js staff-os-v5-integrations.js staff-os-v5-profile.js staff-os-production-analytics-bridge.js staff-os-v5-stability.js staff-logistics-intelligence.css staff-logistics-intelligence.js staff-os-v2-compat.js staff-mobile-command-dock.css staff-mobile-command-dock.js sw.js; do test -f "$file"; done
          grep -q 'https://ahslifnthiwfkmaswjno.supabase.co' staff-os-v5.js
          grep -q 'account-admin' staff-os-v5.js
          grep -q 'operations-v4' staff-os-v5.js
          grep -q 'warehouse-receiving' staff-os-v5.js
          grep -q 'staff-ops-hub' staff-os-v5.js
          ! grep -q 'YOUR_PROJECT_ID' staff-os-v5.html
          ! grep -q 'YOUR_ANON_KEY' staff-os-v5.html
      - name: JavaScript syntax checks
        run: |
          for f in staff-os-v5.js staff-os-v2-compat.js staff-os-v5-shipment-create-fix.js staff-os-v5-shipment-control-bridge.js staff-os-data-health-panel.js staff-os-v5-integrations.js staff-os-v5-profile.js staff-os-production-analytics-bridge.js staff-os-v5-stability.js staff-logistics-intelligence.js staff-mobile-command-dock.js sw.js; do node --check "$f"; done
      - run: npm test
