name: Staff Production Contract

# Manual-only while GitHub-hosted runner capacity is unavailable.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify Staff OS production contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:contracts
      - name: Validate Staff OS files and contracts
        shell: bash
        run: |
          set -euo pipefail
          for file in staff-os-v5.html staff-os-v5.css gc-staff-ui-refinement-20261019-v4.css gc-staff-live-workspace-20261019.css gc-staff-customer-bridge-20261019.js staff-os-v5.js staff-os-v5-20261017.js staff-os-v5-enhancement-loader-20261017.js gc-staff-mobile-dock-20261016.js gc-staff-mobile-dock-20261016.css staff-os-v5-shipment-create-fix.js staff-os-v5-shipment-control-bridge.js staff-os-data-health-panel.js staff-os-v5-integrations.js staff-os-v5-profile.js staff-os-production-analytics-bridge.js staff-os-v5-stability.js staff-logistics-intelligence.css staff-logistics-intelligence.js staff-os-v2-compat.js staff-mobile-command-dock.css staff-mobile-command-dock.js sw.js; do test -f "$file"; done
          grep -q 'https://ahslifnthiwfkmaswjno.supabase.co' staff-os-v5.js
          grep -q 'account-admin' staff-os-v5.js
          grep -q 'operations-v4' staff-os-v5.js
          grep -q 'warehouse-receiving' staff-os-v5.js
          grep -q 'staff-ops-hub' staff-os-v5.js
          grep -q 'gc-staff-ui-refinement-20261019-v4.css?v=4' staff-os-v5.html
          grep -q 'gc-staff-live-workspace-20261019.css?v=4' staff-os-v5.html
          grep -q 'Locale-safe operations data and consistent dark/light workspace surfaces (v3).' gc-staff-live-workspace-20261019.css
          grep -q 'unicode-bidi: isolate' gc-staff-live-workspace-20261019.css
          grep -q 'data-customer-status-filter="unlinked"' staff-os-v5-20261017.js
          grep -q 'data-process-in-app-outbox' staff-os-v5-20261017.js
          grep -q "action:'process_outbox'" staff-os-v5-20261017.js
          grep -q "action:'cancel_outbox'" staff-os-v5-20261017.js
          grep -q 'ageHours(item) >= 24' staff-os-v5-20261017.js
          grep -q 'cancel_outbox' supabase/functions/logistics-control-plane/index.ts
          grep -q 'logistics-control-plane' staff-os-v5-20261017.js
          grep -q "await loadTab(x.dataset.jump)" staff-os-v5-20261017.js
          grep -q 'gc-live-wh-list' staff-os-v5-20261017.js
          grep -q 'staff-os-v5-enhancement-loader-20261017.js?v=18' staff-os-v5.html
          grep -q 'gc-staff-mobile-dock-20261016.css?v=5' staff-os-v5.html
          grep -q 'staff-os-v5-20261017.js?v=20261019-9' staff-os-v5.html
          grep -Fq "const href = '/gc-staff-live-workspace-20261019.css?v=4'" staff-os-v5-enhancement-loader-20261017.js
          ! grep -q 'YOUR_PROJECT_ID' staff-os-v5.html
          ! grep -q 'YOUR_ANON_KEY' staff-os-v5.html
      - name: JavaScript syntax checks
        run: |
          for f in gc-staff-customer-bridge-20261019.js staff-os-v5.js staff-os-v5-20261017.js staff-os-v5-enhancement-loader-20261017.js gc-staff-mobile-dock-20261016.js staff-os-v2-compat.js staff-os-v5-shipment-create-fix.js staff-os-v5-shipment-control-bridge.js staff-os-data-health-panel.js staff-os-v5-integrations.js staff-os-v5-profile.js staff-os-production-analytics-bridge.js staff-os-v5-stability.js staff-logistics-intelligence.js staff-mobile-command-dock.js sw.js; do node --check "$f"; done
      - run: npm test
