name: Production CI and Cloudflare Pages Deploy

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: globall-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/Product' }}

jobs:
  verify-and-deploy:
    name: Validate every change; deploy Product only after PASS
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install locked validation dependencies
        run: npm ci --ignore-scripts

      - name: Repository validation
        run: npm test

      - name: Production contract validation
        run: npm run test:contracts

      - name: Production and security validation
        run: bash scripts/validate-production.sh

      - name: Asset integrity validation
        run: python3 scripts/validate-assets.py

      - name: Build Cloudflare Pages output
        env:
          CF_PAGES_COMMIT_SHA: ${{ github.sha }}
          CF_PAGES_BRANCH: ${{ github.ref_name }}
        run: npm run build

      - name: Validate deployment bundle and pin release metadata
        run: |
          set -euo pipefail
          test -f public/index.html
          test -f public/_headers
          test -f public/_redirects
          test -f public/functions/_middleware.js
          test -f public/functions/api/health.js
          test -f public/functions/api/ready.js
          ! test -d public/supabase
          ! test -d public/scripts
          ! find public -type f \( -name '*.sql' -o -name '*.pem' -o -name '*.key' -o -name '.env' -o -name '.env.*' \) -print -quit | grep -q .
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          release = {
              'service': 'globall-cloud',
              'commit': os.environ['GITHUB_SHA'],
              'branch': os.environ['GITHUB_REF_NAME'],
              'workflow_run': os.environ['GITHUB_RUN_ID'],
          }
          Path('public/release.json').write_text(json.dumps(release, separators=(',', ':')) + '\n', encoding='utf-8')
          PY
          grep -q "$GITHUB_SHA" public/release.json

      - name: Require Cloudflare deployment credentials
        if: github.ref == 'refs/heads/Product' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing repository secret CLOUDFLARE_API_TOKEN (Cloudflare Pages Edit scope required)." >&2; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing repository secret CLOUDFLARE_ACCOUNT_ID." >&2; exit 1; }

      - name: Install Wrangler
        if: github.ref == 'refs/heads/Product' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: npx --yes wrangler@4 --version

      - name: Deploy the tested Product commit to Cloudflare Pages
        if: github.ref == 'refs/heads/Product' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4 pages deploy public \
            --project-name=globall-cloud \
            --branch=Product \
            --commit-hash="$GITHUB_SHA" \
            --commit-message="$GITHUB_SHA $GITHUB_REF_NAME"

      - name: Verify production edge health
        if: github.ref == 'refs/heads/Product' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        shell: bash
        run: |
          set -euo pipefail
          url="https://globall-cloud.pages.dev/api/health"
          for attempt in {1..12}; do
            body="$(curl -fsS --max-time 10 -H 'Cache-Control: no-cache' "$url?verify=$GITHUB_SHA" 2>/dev/null || true)"
            if printf '%s' "$body" | grep -q '\"ok\":true'; then
              printf '%s\n' "$body"
              exit 0
            fi
            echo "Health check attempt $attempt did not return a healthy response yet."
            sleep 5
          done
          echo "Production health check failed."
          exit 1

      - name: Verify production readiness including Supabase dependency
        if: github.ref == 'refs/heads/Product' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        shell: bash
        run: |
          set -euo pipefail
          body=""
          status=""
          for attempt in {1..12}; do
            status="$(curl -sS -o /tmp/globall-ready.json -w '%{http_code}' --max-time 12 -H 'Cache-Control: no-cache' "https://globall-cloud.pages.dev/api/ready?verify=$GITHUB_SHA" || true)"
            body="$(cat /tmp/globall-ready.json 2>/dev/null || true)"
            if [ "$status" = "200" ] && printf '%s' "$body" | grep -q '"status":"ready"'; then
              printf '%s\n' "$body"
              exit 0
            fi
            echo "Readiness attempt $attempt returned HTTP $status"
            sleep 5
          done
          echo "Production readiness check failed."
          printf '%s\n' "$body"
          exit 1

      - name: Verify exact live release matches the tested commit
        if: github.ref == 'refs/heads/Product' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl -fsS --max-time 15 -H 'Cache-Control: no-cache' "https://globall-cloud.pages.dev/release.json?verify=$GITHUB_SHA")"
          python3 - "$body" "$GITHUB_SHA" <<'PY'
          import json, sys
          body = json.loads(sys.argv[1])
          expected = sys.argv[2]
          assert body.get('service') == 'globall-cloud', body
          assert body.get('commit') == expected, body
          print(json.dumps(body, ensure_ascii=False))
          PY

      - name: Run read-only live public and international smoke tests
        if: github.ref == 'refs/heads/Product' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          GC_SITE_URL: https://globall-cloud.pages.dev
        shell: bash
        run: |
          set -euo pipefail
          key="$(node - <<'NODE'
          const fs = require('node:fs');
          const source = fs.readFileSync('gc-csp-scripts/index-inline-2.js', 'utf8');
          const match = source.match(/SUPABASE_PUBLISHABLE_KEY\s*=\s*'([^']+)'/);
          if (!match) process.exit(2);
          process.stdout.write(match[1]);
          NODE
          )"
          echo "::add-mask::$key"
          SUPABASE_PUBLISHABLE_KEY="$key" npm run test:e2e:public
          SUPABASE_PUBLISHABLE_KEY="$key" npm run test:e2e:international
