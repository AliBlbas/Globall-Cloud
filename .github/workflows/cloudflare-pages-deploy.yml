name: Deploy Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    name: Deploy frontend to Cloudflare Pages
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Verify Cloudflare credentials are configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }

      - name: Prepare frontend-only deployment bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .pages-dist
          mkdir -p .pages-dist
          git ls-files -z | while IFS= read -r -d '' file; do
            case "$file" in
              .github/*|.git/*|.wrangler/*|supabase/*|tests/*|docs/*|*.md|*.MD|package.json|package-lock.json|pnpm-lock.yaml|yarn.lock|bun.lockb|tsconfig.json|vite.config.*|wrangler.toml|wrangler.json|wrangler.jsonc|*.sql|*.dump|*.bak|*.log|*.pem|*.key|*.crt|.env|.env.*|*.tf|*.tfvars)
                continue
                ;;
            esac
            mkdir -p ".pages-dist/$(dirname "$file")"
            cp "$file" ".pages-dist/$file"
          done
          test -f .pages-dist/index.html
          test -f .pages-dist/_headers
          test -f .pages-dist/_redirects
          ! test -d .pages-dist/supabase
          ! find .pages-dist -type f \( -name '*.sql' -o -name '*.pem' -o -name '*.key' -o -name '.env' -o -name '.env.*' \) -print -quit | grep -q .

      - name: Install Wrangler
        run: npx --yes wrangler@4 --version

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy .pages-dist --project-name=globall-cloud --branch=main --commit-hash="$GITHUB_SHA" --commit-message="${GITHUB_SHA} ${GITHUB_REF_NAME}"