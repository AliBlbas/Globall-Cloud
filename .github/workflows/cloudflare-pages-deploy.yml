name: Deploy Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    name: Deploy frontend and Pages Functions to Cloudflare
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Verify Cloudflare credentials are configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }

      - name: Validate server-side JavaScript
        run: |
          set -euo pipefail
          node --check functions/_middleware.js
          node --check functions/api/health.js

      - name: Prepare production deployment bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .pages-dist
          mkdir -p .pages-dist
          git ls-files -z | while IFS= read -r -d '' file; do
            case "$file" in
              .github/*|.git/*|.wrangler/*|supabase/*|tests/*|docs/*|*.md|*.MD|package.json|package-lock.json|pnpm-lock.yaml|yarn.lock|bun.lockb|tsconfig.json|vite.config.*|wrangler.toml|wrangler.json|wrangler.jsonc|*.sql|*.dump|*.bak|*.log|*.pem|*.key|*.crt|.env|.env.*|*.tf|*.tfvars)
                continue
                ;;
            esac
            mkdir -p ".pages-dist/$(dirname "$file")"
            cp "$file" ".pages-dist/$file"
          done
          test -f .pages-dist/index.html
          test -f .pages-dist/_headers
          test -f .pages-dist/_redirects
          test -d .pages-dist/functions
          test -f .pages-dist/functions/_middleware.js
          test -f .pages-dist/functions/api/health.js
          ! test -d .pages-dist/supabase
          ! find .pages-dist -type f \( -name '*.sql' -o -name '*.pem' -o -name '*.key' -o -name '.env' -o -name '.env.*' \) -print -quit | grep -q .

          python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path('.pages-dist/release.json').write_text(json.dumps({
              'service': 'globall-cloud',
              'commit': os.environ['GITHUB_SHA'],
              'ref': os.environ['GITHUB_REF_NAME'],
              'workflow_run': os.environ['GITHUB_RUN_ID'],
          }, separators=(',', ':')) + '\n', encoding='utf-8')
          PY
          test -f .pages-dist/release.json
          grep -q "$GITHUB_SHA" .pages-dist/release.json

      - name: Install Wrangler
        run: npx --yes wrangler@4 --version

      - name: Deploy frontend and Pages Functions to production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          cd .pages-dist
          npx --yes wrangler@4 pages deploy . --project-name=globall-cloud --commit-hash="$GITHUB_SHA" --commit-message="${GITHUB_SHA} ${GITHUB_REF_NAME}"

      - name: Verify production edge health
        shell: bash
        run: |
          set -euo pipefail
          url="https://globall-cloud.pages.dev/api/health"
          for attempt in {1..12}; do
            body="$(curl -fsS --max-time 10 "$url" 2>/dev/null || true)"
            if printf '%s' "$body" | grep -q '\"ok\":true'; then
              printf '%s\n' "$body"
              exit 0
            fi
            echo "Health check attempt $attempt did not return a healthy response yet."
            sleep 5
          done
          echo "Production health check failed."
          exit 1

      - name: Verify exact live release matches GitHub commit
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl -fsS --max-time 15 -H 'Cache-Control: no-cache' "https://globall-cloud.pages.dev/release.json?verify=$GITHUB_SHA")"
          python3 - "$body" "$GITHUB_SHA" <<'PY'
          import json, sys
          body = json.loads(sys.argv[1])
          expected = sys.argv[2]
          assert body.get('service') == 'globall-cloud', body
          assert body.get('commit') == expected, body
          print(json.dumps(body, ensure_ascii=False))
          PY
