name: Logistics Feature Gate

# Manual-only while GitHub-hosted runner capacity is unavailable.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: logistics-feature-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:contracts
      - name: Validate production assets and routes
        shell: bash
        run: |
          set -euo pipefail
          for file in mobile-premium-responsive-v2026.css production-mobile-ux-v2026.css tracking-intelligence.css tracking-intelligence.js status.html status-page.js public-production-safety.js staff-logistics-intelligence.css staff-logistics-intelligence.js staff-mobile-command-dock.css staff-mobile-command-dock.js gc-platform-vnext.css gc-platform-vnext.js gc-platform-vnext-plus.css gc-platform-vnext-plus.js gc-runtime-safety-v2026.js production-brand-repair.js staff-os-v5.html supabase/functions/logistics-control-tower/index.ts supabase/config.toml sw.js functions/_middleware.js; do test -s "$file"; done
          grep -q '^/track /tracking-integration.html 200$' _redirects
          grep -q 'logistics-control-tower' supabase/config.toml
          grep -A1 '^\[functions.logistics-control-tower\]' supabase/config.toml | grep -q 'verify_jwt = true'
          grep -q 'Shipment Intelligence' tracking-intelligence.js
          grep -q 'legacy-contract: CACHE_VERSION=' sw.js
          ! grep -q '<script>' status.html
      - name: JavaScript syntax checks
        run: |
          node --check public-production-safety.js
          node --check staff-mobile-command-dock.js
          node --check tracking-intelligence.js
          node --check staff-logistics-intelligence.js
          node --check status-page.js
          node --check gc-platform-vnext.js
          node --check gc-platform-vnext-plus.js
          node --check gc-runtime-safety-v2026.js
          node --check production-brand-repair.js
          node --check functions/_middleware.js
      - name: TypeScript bundle check
        run: npx --yes esbuild@0.25.9 supabase/functions/logistics-control-tower/index.ts --bundle --platform=neutral --format=esm --outfile=/tmp/logistics-control-tower-check.js
      - run: npm test
