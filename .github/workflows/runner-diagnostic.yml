name: Runner Diagnostic

# Manual-only while GitHub-hosted runner capacity is unavailable.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runner-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnostic:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Inspect runner
        shell: bash
        run: |
          set -euo pipefail
          echo "runner=${RUNNER_NAME}"
          echo "os=${RUNNER_OS}"
          echo "arch=${RUNNER_ARCH}"
          uname -a
          node --version
          npm --version
      - name: Verify repository access
        shell: bash
        run: |
          set -euo pipefail
          test -f package.json
          test -f sw.js
          echo "runner-ok"
      - name: Emit diagnostic release marker
        run: echo "runner-diagnostic-release=2026-09-18-ubuntu-22"
