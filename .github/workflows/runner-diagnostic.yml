name: Runner Diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/runner-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runner-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnostic:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Inspect runner
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "runner=$env:RUNNER_NAME"
          Write-Host "os=$env:RUNNER_OS"
          Write-Host "arch=$env:RUNNER_ARCH"
          node --version
          npm --version
      - name: Verify repository access
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path package.json)) { throw 'package.json missing' }
          if (-not (Test-Path sw.js)) { throw 'sw.js missing' }
          Write-Host 'runner-ok'
      - name: Emit diagnostic release marker
        shell: pwsh
        run: Write-Host 'runner-diagnostic-release=2026-09-21-windows'
