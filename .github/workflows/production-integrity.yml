name: Production Integrity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Repository validation
        run: npm test

      - name: Production invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'gc-v85' sw.js
          grep -q 'warehouse-offline-sync.js?v=20260903-1' sw.js
          grep -q 'runtime-guard.js?v=20260903-2' sw.js
          grep -q 'staff-os-fx.js?v=20260903-2' sw.js
          grep -q 'staff-os-enhancements-v2.js' runtime-guard.js
          grep -q 'staff-os-fx.js' runtime-guard.js
          grep -q 'staff-os-warehouse-notify.js' runtime-guard.js
          grep -q 'warehouse-offline-sync.js' runtime-guard.js
          grep -q 'staff-os-dashboard.js' sw.js
          grep -q 'staff-os-ai-tools.js' sw.js
          grep -q 'customer-portal.html' sw.js
          grep -q 'warehouse-os.html' sw.js
          grep -q 'tracking-integration.html' sw.js
          grep -q '^/track /tracking-integration.html 200$' _redirects
          grep -q '^/track/ /tracking-integration.html 200$' _redirects
          grep -q 'id="gcTrackingForm"' tracking-integration.html
          grep -q 'staff-analytics' supabase/functions/staff-analytics/index.ts
          grep -q 'warehouse-notify' supabase/functions/warehouse-notify/index.ts
          grep -q 'invoice-ai' supabase/functions/invoice-ai/index.ts
          grep -q 'customer-debt-assistant' supabase/functions/customer-debt-assistant/index.ts
          grep -q 'fx-refresh' supabase/functions/fx-refresh/index.ts
          grep -q 'production_security_hardening' supabase/migrations/20260903010000_production_security_hardening.sql
          grep -q 'account.created' supabase/migrations/20260903005417_customer_account_created_notifications.sql
          grep -q 'idempotency' supabase/migrations/20260903005958_add_warehouse_receipt_idempotency_v2.sql
          grep -q 'external_reference' supabase/migrations/20260903010449_add_shipment_external_reference_v1.sql
          grep -q 'project_id = "swptmhhwhdtyrrfzetam"' supabase/config.toml
          grep -q 'Content-Security-Policy' _headers
          grep -q "script-src 'self'" _headers
          ! grep -q "script-src[^;]*unsafe-inline" _headers
          ! grep -RnoE '(service_role[_-]?key|SUPABASE_SERVICE_ROLE_KEY)[^A-Za-z0-9_.].{0,4}["'"']?[[:space:]]*[:=][[:space:]]*["'"'](eyJ|sb_secret_)[A-Za-z0-9._-]{10,}' --exclude-dir=.git --exclude='*.md' .

      - name: Validate migration names
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            base="$(basename "$file")"
            [[ "$base" =~ ^[0-9]{14}_[a-z0-9_]+\.sql$ ]]
          done < <(find supabase/migrations -maxdepth 1 -type f -name '*.sql' -print0)

      - name: Verify critical production files
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            index.html sw.js production-bridge.js runtime-guard.js _headers _redirects \
            tracking-integration.html customer-portal.html warehouse-os.html driver-workspace.html \
            staff-os.html super-admin-command-center.html warehouse-offline-sync.js \
            supabase/config.toml \
            supabase/functions/logistics-control-plane/index.ts \
            supabase/functions/notification-dispatch/index.ts \
            supabase/functions/warehouse-receiving/index.ts \
            supabase/functions/warehouse-notify/index.ts \
            supabase/functions/staff-ops-hub/index.ts \
            supabase/functions/staff-analytics/index.ts \
            supabase/functions/invoice-ai/index.ts \
            supabase/functions/customer-debt-assistant/index.ts \
            supabase/functions/fx-refresh/index.ts \
            supabase/migrations/20260903010000_production_security_hardening.sql \
            supabase/migrations/20260903005417_customer_account_created_notifications.sql \
            supabase/migrations/20260903005958_add_warehouse_receipt_idempotency_v2.sql \
            supabase/migrations/20260903010449_add_shipment_external_reference_v1.sql; do
            test -f "$file"
          done

      - name: Public live smoke test
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, urllib.request
          site = 'https://globall-cloud.pages.dev'
          for path in ('/', '/track', '/tracking-integration.html', '/warehouse-os.html', '/customer-portal.html'):
              with urllib.request.urlopen(site + path, timeout=20) as r:
                  body = r.read().decode('utf-8', 'replace')
                  assert r.status == 200 and len(body) > 200, (path, r.status, len(body))
          print('Public live smoke test passed')
          PY
