name: Production Integrity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Repository validation
        run: npm test

      - name: Validate production project reference
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^project_id = "ahslifnthiwfkmaswjno"$' supabase/config.toml
          if grep -RIl 'swptmhhwhdtyrrfzetam' --include='*.js' --include='*.mjs' --include='*.ts' --include='*.tsx' --include='*.html' --include='*.css' --include='*.json' --include='*.toml' --include='*.yml' --include='*.yaml' .; then
            echo 'stale Supabase project reference detected'
            exit 1
          fi

      - name: Production invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'gc-v85' sw.js
          grep -q 'warehouse-offline-sync.js?v=20260903-1' sw.js
          grep -q 'runtime-guard.js?v=20260903-2' sw.js
          grep -q 'staff-os-fx.js?v=20260903-2' sw.js
          grep -q 'staff-os-enhancements-v2.js' runtime-guard.js
          grep -q 'staff-os-fx.js' runtime-guard.js
          grep -q 'staff-os-warehouse-notify.js' runtime-guard.js
          grep -q 'warehouse-offline-sync.js' runtime-guard.js
          grep -q 'staff-os-dashboard.js' sw.js
          grep -q 'staff-os-ai-tools.js' sw.js
          grep -q 'customer-portal.html' sw.js
          grep -q 'warehouse-os.html' sw.js
          grep -q 'tracking-integration.html' sw.js
          grep -q '^/track /tracking-integration.html 200$' _redirects
          grep -q '^/track/ /tracking-integration.html 200$' _redirects
          grep -q 'id="gcTrackingForm"' tracking-integration.html
          grep -q 'staff-analytics' supabase/functions/staff-analytics/index.ts
          grep -q 'warehouse-notify' supabase/functions/warehouse-notify/index.ts
          grep -q 'invoice-ai' supabase/functions/invoice-ai/index.ts
          grep -q 'customer-debt-assistant' supabase/functions/customer-debt-assistant/index.ts
          grep -q 'fx-refresh' supabase/functions/fx-refresh/index.ts
          find supabase/migrations -maxdepth 1 -type f -name '*production_security_hardening*.sql' | grep -q .
          find supabase/migrations -maxdepth 1 -type f -name '*fix_alert_monitor_uuid_text_cast_v1*.sql' | grep -q .
          find supabase/migrations -maxdepth 1 -type f -name '*add_warehouse_receipt_idempotency_v2*.sql' | grep -q .
          find supabase/migrations -maxdepth 1 -type f -name '*add_shipment_external_reference_v1*.sql' | grep -q .
          find supabase/migrations -maxdepth 1 -type f -name '*production_runtime_alignment_v1*.sql' | grep -q .
          grep -q 'ahslifnthiwfkmaswjno' production-bridge.js
          grep -q 'ahslifnthiwfkmaswjno.supabase.co' _headers
          grep -q 'Content-Security-Policy' _headers
          grep -q "script-src 'self'" _headers
          ! grep -q "script-src[^;]*unsafe-inline" _headers
          ! grep -RnoE '(service_role[_-]?key|SUPABASE_SERVICE_ROLE_KEY)[^A-Za-z0-9_.].{0,4}["'"']?[[:space:]]*[:=][[:space:]]*["'"'](eyJ|sb_secret_)[A-Za-z0-9._-]{10,}' --exclude-dir=.git --exclude='*.md' .

      - name: Validate migration names
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            base="$(basename "$file")"
            [[ "$base" =~ ^[0-9]{14}_[a-z0-9_]+\.sql$ ]]
          done < <(find supabase/migrations -maxdepth 1 -type f -name '*.sql' -print0)

      - name: Verify critical production files
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            index.html sw.js production-bridge.js runtime-guard.js _headers _redirects \
            tracking-integration.html customer-portal.html warehouse-os.html driver-workspace.html \
            staff-os.html super-admin-command-center.html warehouse-offline-sync.js \
            supabase/config.toml \
            supabase/functions/logistics-control-plane/index.ts \
            supabase/functions/notification-dispatch/index.ts \
            supabase/functions/warehouse-receiving/index.ts \
            supabase/functions/warehouse-notify/index.ts \
            supabase/functions/staff-ops-hub/index.ts \
            supabase/functions/staff-analytics/index.ts \
            supabase/functions/invoice-ai/index.ts \
            supabase/functions/customer-debt-assistant/index.ts \
            supabase/functions/fx-refresh/index.ts \
            tests/validate.mjs tests/e2e/run.mjs; do
            test -f "$file"
          done

      - name: Guard runtime connection messaging
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'LEGACY_MESSAGE' production-bridge.js
          grep -q 'gc:staff-auth-ready' runtime-guard.js
          grep -q 'warehouse-offline-sync.js' runtime-guard.js

      - name: Derive public API key for read-only E2E
        shell: bash
        run: |
          set -euo pipefail
          key="$(python3 - <<'PY'
          import re
          text=open('production-bridge.js',encoding='utf-8').read()
          m=re.search(r"SUPABASE_PUBLISHABLE_KEY\s*=\s*['\"]([^'\"]+)['\"]",text)
          if not m: raise SystemExit('publishable key not found')
          print(m.group(1))
          PY
          )"
          echo "SUPABASE_ANON_KEY=$key" >> "$GITHUB_ENV"

      - name: Live public smoke test
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,re,urllib.request
          site='https://globall-cloud.pages.dev'
          supabase='https://ahslifnthiwfkmaswjno.supabase.co'
          for path in ('/','/track','/tracking-integration.html','/warehouse-os.html','/customer-portal.html'):
              with urllib.request.urlopen(site+path,timeout=20) as r:
                  body=r.read().decode('utf-8','replace')
                  assert r.status==200 and len(body)>200,(path,r.status,len(body))
          bridge=urllib.request.urlopen(site+'/production-bridge.js?e2e=1',timeout=20).read().decode('utf-8','replace')
          m=re.search(r"SUPABASE_PUBLISHABLE_KEY\s*=\s*['\"]([^'\"]+)['\"]",bridge)
          assert m
          req=urllib.request.Request(supabase+'/functions/v1/public-config?key=usd_iqd_rate',headers={'Origin':site,'Accept':'application/json','apikey':m.group(1)})
          with urllib.request.urlopen(req,timeout=20) as r:
              body=json.loads(r.read().decode('utf-8','replace'))
              assert r.status==200 and body.get('key')=='usd_iqd_rate' and body.get('value') not in (None,'')
          PY

      - name: Read-only public E2E
        env:
          GC_SITE_URL: https://globall-cloud.pages.dev
          E2E_SUPABASE_URL: https://ahslifnthiwfkmaswjno.supabase.co
        run: npm run test:e2e:public
