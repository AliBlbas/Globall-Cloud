name: Production Integrity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install validation dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Run repository validation
        run: npm test

      - name: Validate production headers and Supabase wiring
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'ahslifnthiwfkmaswjno.supabase.co' production-bridge.js
          grep -q 'site_url = "https://globall-cloud.pages.dev"' supabase/config.toml
          grep -q 'wss://ahslifnthiwfkmaswjno.supabase.co' _headers
          grep -q 'Content-Security-Policy' _headers
          grep -q 'camera=(self)' _headers
          grep -q 'geolocation=(self)' _headers
          ! grep -RniE 'SUPABASE_SERVICE_ROLE_KEY|SUPABASE_SECRET_KEY|sb_secret_' \
            --exclude-dir=.git --exclude-dir=supabase/functions --exclude-dir=functions --exclude='*.md' .

      - name: Validate unified release package
        shell: bash
        run: |
          set -euo pipefail
          test -f Globall-Cloud-Unified.zip
          rm -rf .release
          mkdir .release
          unzip -q -o Globall-Cloud-Unified.zip -d .release
          for file in \
            .release/supabase/functions/document-access/index.ts \
            .release/supabase/functions/logistics-control-plane/index.ts \
            .release/supabase/functions/notification-dispatch/index.ts \
            .release/supabase/functions/integration-webhook/index.ts \
            .release/supabase/functions/payment-checkout/index.ts \
            .release/supabase/functions/payment-webhook/index.ts \
            .release/supabase/functions/payment-reconcile/index.ts; do
            test -f "$file"
          done

      - name: Live production smoke test
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, re, urllib.request
          site = 'https://globall-cloud.pages.dev/'
          config = 'https://ahslifnthiwfkmaswjno.supabase.co/functions/v1/public-config?key=usd_iqd_rate'
          opener = urllib.request.build_opener(urllib.request.HTTPRedirectHandler())
          site_request = urllib.request.Request(site, headers={'User-Agent': 'globall-cloud-production-smoke/1.0'})
          with opener.open(site_request, timeout=20) as r:
              html = r.read().decode('utf-8', 'replace')
              assert r.status == 200
              access_protected = 'Cloudflare Access' in html or 'Log in to All Workers' in html
              public_site = 'Globall Cloud' in html
              assert public_site or access_protected, 'unexpected production response'
              print('production site smoke test:', 'Cloudflare Access protected' if access_protected else 'public site reachable')
          bridge = open('production-bridge.js', encoding='utf-8').read()
          key = re.search(r"SUPABASE_PUBLISHABLE_KEY\s*=\s*['\"]([^'\"]+)['\"]", bridge)
          assert key, 'publishable key marker missing'
          req = urllib.request.Request(config, headers={
              'Origin': 'https://globall-cloud.pages.dev',
              'Accept': 'application/json',
              'User-Agent': 'globall-cloud-production-smoke/1.0',
              'apikey': key.group(1),
          })
          with urllib.request.urlopen(req, timeout=20) as r:
              body = json.loads(r.read().decode('utf-8', 'replace'))
              assert r.status == 200
              assert body.get('key') == 'usd_iqd_rate'
              assert body.get('value') not in (None, '')
          print('production smoke test: PASS')
          PY
