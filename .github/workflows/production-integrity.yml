name: Production Integrity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find . -type f -name '*.js' -not -path './.git/*' -print0)
          python3 scripts/validate-assets.py
      - name: Run repository validation suite
        run: npm test
      - name: Check critical integration invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -q "ahslifnthiwfkmaswjno.supabase.co" production-bridge.js
          grep -q "account-admin" accounts-console-script.js
          grep -q "gc-v84" sw.js
          grep -q "warehouse-offline-sync.js?v=20260903-1" sw.js
          grep -q "site-enhancement-20260824.css" sw.js
          grep -q "driver-workspace.html" sw.js
          grep -q "operations-control-v2.html" sw.js
          grep -q "operations-events.js" sw.js
          grep -q "customer-portal.html" sw.js
          grep -q "warehouse-os.html" sw.js
          grep -q "production-bridge.js" sw.js
          grep -q "staff-auth-fix.js" sw.js
          grep -q "staff-os-console.js?v=20260826-1" sw.js
          grep -q "staff-os-ultra.css?v=20260826-1" sw.js
          grep -q "tracking-enhanced.js?v=20260826-2" sw.js
          grep -q "tracking-route-controller.js?v=20260826-2" sw.js
          grep -q "id=\"gcTrackingForm\"" tracking-integration.html
          grep -q "tracking-route-controller.js?v=20260826-2" tracking-integration.html
          grep -q "customer-portal-inline-1.js?v=20260825-2" sw.js
          grep -q "operations-exception-engine.js" sw.js
          grep -q "^/track /tracking-integration.html 200$" _redirects
          grep -q "^/track/ /tracking-integration.html 200$" _redirects
          grep -q "^/staff /staff-os.html 200$" _redirects
          grep -q "^/staff/ /staff-os.html 200$" _redirects
          grep -q "control-plane.html" sw.js
          grep -q "control-plane.js" sw.js
          grep -q "payment-checkout.html" sw.js
          grep -q "payment-checkout.js" sw.js
          grep -q "gc-csp-scripts/customer-portal-inline-1.js" sw.js
          grep -q "logistics-control-plane" README.md
          grep -q "notification-dispatch" README.md
          grep -q "integration-webhook" README.md
          grep -q "payment-checkout" README.md
          grep -q "payment-webhook" README.md
          grep -q "payment-reconcile" README.md
          grep -q "super-admin-live-control-v2.js" functions/_middleware.js
          grep -q "super-admin-live-control-v2.js?v=20260829-2" super-admin-command-center.html
          grep -q "super-admin-live-control-v2.js?v=20260829-2" sw.js
          grep -q "customerRows" super-admin-command-center.html
          grep -q "gcAddCustomer" super-admin-live-control-v2.js
          grep -q "data-save-price" super-admin-live-control-v2.js
          grep -q "updateExchangeRate" supabase/functions/account-admin/index.ts
          grep -q "updatePricing" supabase/functions/account-admin/index.ts
          grep -q "staff-os-enhancements-v2.js" runtime-guard.js
          grep -q "staff-os-fx.js" runtime-guard.js
          grep -q "staff-os-warehouse-notify.js" runtime-guard.js
          grep -q "staff-os-dashboard.js" sw.js
          grep -q "staff-os-ai-tools.js" sw.js
          grep -q "staff-analytics" supabase/functions/staff-analytics/index.ts
          grep -q "warehouse-notify" supabase/functions/warehouse-notify/index.ts
          grep -q "invoice-ai" supabase/functions/invoice-ai/index.ts
          grep -q "customer-debt-assistant" supabase/functions/customer-debt-assistant/index.ts
          grep -q "customer-receipt-evidence" supabase/functions/customer-receipt-evidence/index.ts
          grep -q "production_security_hardening" supabase/migrations/20260903010000_production_security_hardening.sql
          grep -q "lock_bootstrap_admin_rpc" supabase/migrations/20260903011000_lock_bootstrap_admin_rpc.sql
          grep -q "no-store" _headers
          grep -q "Content-Security-Policy" _headers
          grep -q "wss://ahslifnthiwfkmaswjno.supabase.co" _headers
          grep -q "camera=(self)" _headers
          grep -q "geolocation=(self)" _headers
          grep -q 'project_id = "ahslifnthiwfkmaswjno"' supabase/config.toml
          grep -q '\[functions.account-admin\]' supabase/config.toml
          grep -q 'verify_jwt = true' supabase/config.toml
          ! grep -RnoE "(service_role[_-]?key|SUPABASE_SERVICE_ROLE_KEY)[^A-Za-z0-9_.].{0,4}['\"]?\s*[:=]\s*['\"](eyJ|sb_secret_)[A-Za-z0-9._-]{10,}" --exclude-dir=.git --exclude='*.md' .
      - name: Check control-plane CSP surface
        shell: bash
        run: |
          set -euo pipefail
          ! grep -nE '<script[^>]*>([^<]|$)' control-plane.html
          ! grep -nE '\s(on(click|change|submit|keydown|keyup|input|load|error))\s*=' control-plane.html
          ! grep -nE '<script[^>]*>([^<]|$)' payment-checkout.html
          ! grep -nE '\s(on(click|change|submit|keydown|keyup|input|load|error))\s*=' payment-checkout.html
          grep -q "script-src 'self'" _headers
          ! grep -q "script-src[^;]*unsafe-inline" _headers
          grep -q "INTEGRATION_WEBHOOK_SECRET" supabase/functions/integration-webhook/index.ts
          grep -q "verify_jwt = false" supabase/config.toml
          grep -q "\[functions.payment-checkout\]" supabase/config.toml
          grep -q "\[functions.payment-webhook\]" supabase/config.toml
          grep -q "\[functions.payment-reconcile\]" supabase/config.toml
          grep -q "\[functions.document-access\]" supabase/config.toml
          grep -q "\[functions.notification-dispatch\]" supabase/config.toml
          grep -q "NOTIFICATION_WORKER_SECRET" supabase/functions/notification-dispatch/index.ts
          grep -q "claim_notification_outbox_channel" supabase/functions/logistics-control-plane/index.ts
          grep -q "claim_notification_outbox_external" supabase/functions/notification-dispatch/index.ts
          grep -q "customer_user_id" gc-csp-scripts/logistics-os-inline-1.js
          grep -q "document_status" gc-csp-scripts/operations-command-center-inline-1.js
          grep -q "RESEND_API_KEY" supabase/functions/notification-dispatch/index.ts
          grep -q "PAYMENT_WORKER_SECRET" supabase/functions/payment-reconcile/index.ts
          grep -q "revoke all on function public.guard_payment_session_update" supabase/migrations/20260903010000_production_security_hardening.sql
          grep -q "revoke all on function public.queue_warehouse_whatsapp" supabase/migrations/20260903010000_production_security_hardening.sql
          grep -q "alter function public.calculate_chargeable_weight" supabase/migrations/20260903010000_production_security_hardening.sql
          grep -q "revoke all on function public.bootstrap_first_admin" supabase/migrations/20260903011000_lock_bootstrap_admin_rpc.sql
      - name: Validate Supabase migration filenames
        shell: bash
        run: |
          set -euo pipefail
          if [ -d supabase/migrations ]; then
            find supabase/migrations -maxdepth 1 -type f -name '*.sql' -print0 | while IFS= read -r -d '' file; do base="$(basename "$file")"; [[ "$base" =~ ^[0-9]{14}_[a-z0-9_]+\.sql$ ]]; done
          fi
      - name: Verify required production files exist
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            index.html sw.js production-bridge.js runtime-guard.js tracking-enhanced.js tracking-route-controller.js warehouse-offline-sync.js \
            mobile-final.css driver-portal.html driver-portal.js driver-portal-mobile.css \
            staff-auth-fix.js staff-os-enhancements-v2.js staff-os-fx.js staff-os-warehouse-notify.js \
            staff-os-dashboard.js staff-os-ai-tools.js operations-exception-engine.js operations-events.js \
            driver-workspace.html customer-portal.html warehouse-os.html \
            operations-control.html operations-control-v2.html accounts-console.html \
            staff-os.html logistics-os.html operations-command-center.html \
            control-plane.html control-plane.js control-plane.css control-plane-data-hub.js \
            super-admin-live-control-v2.js super-admin-staff-manager.js super-admin-staff-manager.css \
            tracking-integration.html _redirects \
            supabase/config.toml functions/health.js \
            supabase/functions/logistics-control-plane/index.ts \
            supabase/functions/document-access/index.ts \
            supabase/functions/notification-dispatch/index.ts \
            supabase/functions/integration-webhook/index.ts \
            supabase/functions/payment-checkout/index.ts \
            supabase/functions/payment-webhook/index.ts \
            supabase/functions/payment-reconcile/index.ts \
            supabase/functions/system-health/index.ts \
            supabase/functions/account-admin/index.ts \
            supabase/functions/warehouse-receiving/index.ts \
            supabase/functions/warehouse-receipt-proof/index.ts \
            supabase/functions/customer-receipt-evidence/index.ts \
            supabase/functions/staff-analytics/index.ts \
            supabase/functions/staff-ops-hub/index.ts \
            supabase/functions/warehouse-notify/index.ts \
            supabase/functions/invoice-ai/index.ts \
            supabase/functions/customer-debt-assistant/index.ts \
            supabase/functions/_shared/payment-providers.ts \
            supabase/migrations/20260903010000_production_security_hardening.sql \
            supabase/migrations/20260903011000_lock_bootstrap_admin_rpc.sql \
            payment-checkout.html payment-checkout.css payment-checkout.js payment-gateway.js \
            site-enhancement-20260824.css
          do test -f "$file"; done
      - name: Guard runtime connection messaging
        shell: bash
        run: |
          set -euo pipefail
          grep -q "LEGACY_MESSAGE" runtime-guard.js
          grep -q "gc:staff-auth-ready" runtime-guard.js
          grep -q "warehouse-offline-sync.js" runtime-guard.js
      - name: Live smoke test — public site and config API
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, re, urllib.request
          site = "https://globall-cloud.pages.dev/"
          track = "https://globall-cloud.pages.dev/track"
          config = "https://ahslifnthiwfkmaswjno.supabase.co/functions/v1/public-config?key=usd_iqd_rate"
          with urllib.request.urlopen(site, timeout=20) as response:
              html = response.read().decode("utf-8", "replace")
              assert response.status == 200
              assert "Globall Cloud" in html
          with urllib.request.urlopen(track, timeout=20) as response:
              html = response.read().decode("utf-8", "replace")
              assert response.status == 200
              assert "GC SHIPMENT TRACKING" in html or "شوێنی بارەکەت" in html
          bridge = open("production-bridge.js", encoding="utf-8").read()
          match = re.search(r"SUPABASE_PUBLISHABLE_KEY\s*=\s*['\"]([^'\"]+)['\"]", bridge)
          assert match
          req = urllib.request.Request(config, headers={"Origin":"https://globall-cloud.pages.dev","Accept":"application/json","apikey":match.group(1)})
          with urllib.request.urlopen(req, timeout=20) as response:
              body = json.loads(response.read().decode("utf-8", "replace"))
              assert response.status == 200
              assert body.get("key") == "usd_iqd_rate"
              assert body.get("value") not in (None, "")
          PY
