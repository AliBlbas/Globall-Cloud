name: Supabase Edge Functions Deploy

on:
  push:
    branches:
      - Product
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Run full CI before Supabase deployment
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install locked validation dependencies
        run: npm ci --ignore-scripts
      - name: Repository validation
        run: npm test
      - name: Production contract validation
        run: npm run test:contracts
      - name: Production and security validation
        run: bash scripts/validate-production.sh
      - name: Asset integrity validation
        run: python3 scripts/validate-assets.py

  deploy-warehouse-functions:
    name: Deploy warehouse Edge Functions
    if: github.ref == 'refs/heads/Product' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SUPABASE_PROJECT_REF: ahslifnthiwfkmaswjno
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Require Supabase deploy credential
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "Missing repository secret SUPABASE_ACCESS_TOKEN. Add a Supabase Personal Access Token with function deployment permission." >&2
            exit 1
          fi

      - name: Deploy warehouse-receiving
        run: npx --yes supabase@2.58.5 functions deploy warehouse-receiving --project-ref "$SUPABASE_PROJECT_REF" --token "$SUPABASE_ACCESS_TOKEN"

      - name: Deploy warehouse-notify
        run: npx --yes supabase@2.58.5 functions deploy warehouse-notify --project-ref "$SUPABASE_PROJECT_REF" --token "$SUPABASE_ACCESS_TOKEN"

      - name: Confirm deployed function endpoints
        run: |
          echo "warehouse-receiving: https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/warehouse-receiving"
          echo "warehouse-notify: https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/warehouse-notify"
