name: Supabase Source Consistency

# Manual-only while GitHub-hosted runner capacity is unavailable.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Verify Supabase service-key compatibility
        run: node scripts/normalize-supabase-secrets.mjs --check
      - name: Verify production contracts
        run: node scripts/production-contracts.mjs
