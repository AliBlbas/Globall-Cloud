name: Deploy Supabase Edge Functions

on:
  push:
    branches: [main]
    paths:
      - 'Globall-Cloud-Unified.zip'
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/supabase-functions-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ahslifnthiwfkmaswjno
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Expand unified release package
        shell: bash
        run: |
          set -euo pipefail
          test -f Globall-Cloud-Unified.zip
          rm -rf .release
          mkdir -p .release
          unzip -q -o Globall-Cloud-Unified.zip -d .release
          if [ -d .release/supabase ]; then
            cp -a .release/supabase/. supabase/
          fi

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy Edge Functions
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_ID"
