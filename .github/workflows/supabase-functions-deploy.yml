name: Supabase Source Consistency

# Manual-only while GitHub-hosted runner capacity is unavailable.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Verify Supabase service-key compatibility
        run: node scripts/normalize-supabase-secrets.mjs --check
      - name: Verify production contracts
        run: node scripts/production-contracts.mjs
