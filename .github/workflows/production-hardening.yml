name: Production Hardening

# Manual-only while GitHub-hosted runner capacity is unavailable.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hardening:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Syntax and repository checks
        run: |
          set -euo pipefail
          while IFS= read -r -d '' f; do node --check "$f"; done < <(find . -type f -name '*.js' -not -path './.git/*' -not -path './node_modules/*' -print0)
          python3 scripts/validate-assets.py
          npm test
      - name: Contract checks
        run: |
          set -euo pipefail
          grep -q '^/track /tracking-integration.html 200$' _redirects
          grep -q '^/track/ /tracking-integration.html 200$' _redirects
          grep -q 'warehouse-offline-sync.js?v=20260903-1' sw.js
          grep -q 'warehouse-offline-sync.js?v=20260903-1' warehouse-os.html
          test -n "$(find supabase/functions -path '*/fx-refresh/index.ts' -print -quit)"
          grep -q '\[functions.staff-analytics\]' supabase/config.toml
          grep -q '\[functions.fx-refresh\]' supabase/config.toml
          grep -q "script-src 'self'" _headers
          ! grep -q 'script-src[^;]*unsafe-inline' _headers
      - name: Critical source files
        run: |
          for file in supabase/functions/public-config/index.ts supabase/functions/public-message/index.ts supabase/functions/public-quote/index.ts supabase/functions/public-pricing/index.ts supabase/functions/public-track/index.ts supabase/functions/customer-self/index.ts supabase/functions/payment-webhook/index.ts supabase/functions/_shared/payment-providers.ts; do test -f "$file"; done
          test ! -f supabase/functions/payment-webhook/index.js
