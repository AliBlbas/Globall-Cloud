name: Production Hardening
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hardening:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Syntax and repository checks
        run: |
          set -euo pipefail
          while IFS= read -r -d '' f; do node --check "$f"; done < <(find . -type f -name '*.js' -not -path './.git/*' -not -path './node_modules/*' -print0)
          python3 scripts/validate-assets.py
          npm test
      - name: Contract checks
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^/track /tracking-integration.html 200$' _redirects
          grep -q '^/track/ /tracking-integration.html 200$' _redirects
          grep -q 'warehouse-offline-sync.js?v=20260903-1' sw.js
          grep -q 'warehouse-offline-sync.js?v=20260903-1' warehouse-os.html
          grep -q 'supabase/functions/fx-refresh/index.ts' <(printf '%s\n' "$(find supabase/functions -path '*/fx-refresh/index.ts')")
          grep -q '\[functions.staff-analytics\]' supabase/config.toml
          grep -q 'verify_jwt = false' supabase/config.toml
          grep -q '\[functions.fx-refresh\]' supabase/config.toml
          grep -q 'production_security_hardening' supabase/migrations/20260903010000_production_security_hardening.sql
          grep -q 'add_shipment_external_reference' <(printf '%s\n' "$(find supabase/migrations -type f -name '*external_reference*.sql')")
          grep -q 'server_runtime_privileges' <(printf '%s\n' "$(find supabase/migrations -type f -name '*server_runtime_privileges*.sql')")
          grep -q 'fx_worker_schedule' <(printf '%s\n' "$(find supabase/migrations -type f -name '*fx_worker_schedule*.sql')")
          grep -q "script-src 'self'" _headers
          ! grep -q 'script-src[^;]*unsafe-inline' _headers
          python3 - <<'PY'
          from pathlib import Path
          import re, sys
          root = Path('.')
          blocked = {'.git', '.wrangler', 'node_modules'}
          patterns = [
              re.compile(r'''(?i)SUPABASE_SERVICE_ROLE_KEY\s*[:=]\s*["'](?:eyJ|sb_secret_)[A-Za-z0-9._-]{10,}'''),
              re.compile(r'''(?i)service_role[_-]?key\s*[:=]\s*["'](?:eyJ|sb_secret_)[A-Za-z0-9._-]{10,}'''),
              re.compile(r'''(?i)CLOUDFLARE_API_TOKEN\s*[:=]\s*["'][A-Za-z0-9._-]{20,}'''),
          ]
          allowed_suffixes = {'.js','.mjs','.ts','.tsx','.html','.css','.json','.toml','.yml','.yaml','.sh','.py'}
          for path in root.rglob('*'):
              if not path.is_file() or any(part in blocked for part in path.parts) or path.suffix not in allowed_suffixes:
                  continue
              try:
                  text = path.read_text(encoding='utf-8', errors='ignore')
              except Exception:
                  continue
              for pattern in patterns:
                  if pattern.search(text):
                      print(f'secret-like value detected in {path}', file=sys.stderr)
                      raise SystemExit(1)
          PY
