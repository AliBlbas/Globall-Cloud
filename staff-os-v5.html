<!doctype html>
<html lang="ckb" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#03101f">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="description" content="Globall Cloud secure staff operations system">
  <title>Globall Cloud — Staff OS V5</title>
  <link rel="icon" href="/logo-icon.png">
  <link rel="manifest" href="/staff-manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap">
  <link rel="stylesheet" href="/staff-os-v5.css?v=20260912-2">
  <link rel="stylesheet" href="/staff-logistics-intelligence.css?v=20260912-2">
  <link rel="stylesheet" href="/staff-mobile-command-dock.css?v=20260912-2">
  <link rel="stylesheet" href="/mobile-premium-responsive-v2026.css?v=20260912-2">
  <link rel="stylesheet" href="/staff-os-pro-20260909.css?v=20260912-2">
  <link rel="stylesheet" href="/staff-shell-polish-20260909.css?v=20260912-2">
  <link rel="stylesheet" href="/staff-premium-mobile-20260909.css?v=20260912-2">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js" defer></script>
</head>
<body>
  <div id="app"></div>

  <!-- Core Staff OS: these are the only scripts allowed to participate in the
       initial authentication/render lifecycle. -->
  <script src="/staff-os-v5.js?v=20260912-2" defer></script>

  <!-- Enhancement layer: deliberately delayed until the real V5 shell exists.
       Several historical enhancements wrap window.fetch; loading them before
       the core shell is ready can create race conditions during login. -->
  <script>
  (() => {
    'use strict';
    const enhancementScripts = [
      '/staff-os-v5-shipment-create-fix.js?v=20260912-2',
      '/staff-os-v5-shipment-control-bridge.js?v=20260912-2',
      '/staff-os-data-health-panel.js?v=20260912-2',
      '/staff-os-v5-integrations.js?v=20260912-2',
      '/staff-os-v5-profile.js?v=20260912-2',
      '/staff-os-production-analytics-bridge.js?v=20260912-2',
      '/staff-os-v5-stability.js?v=20260912-2',
      '/staff-logistics-intelligence.js?v=20260912-2',
      '/staff-os-v2-compat.js?v=20260912-2',
      '/staff-mobile-command-dock.js?v=20260912-2',
      '/staff-os-pro-20260909.js?v=20260912-2',
      '/staff-shell-polish-20260909.js?v=20260912-2',
      '/staff-premium-mobile-20260909.js?v=20260912-2',
      '/staff-workflow-chain.js?v=20260912-2'
    ];
    const loadOne = (src) => new Promise((resolve) => {
      const s = document.createElement('script');
      s.src = src;
      s.defer = false;
      s.onload = resolve;
      s.onerror = resolve;
      document.body.appendChild(s);
    });
    const loadEnhancements = async () => {
      if (window.__gcStaffEnhancementsLoaded) return;
      if (!document.querySelector('.gc-shell')) return;
      window.__gcStaffEnhancementsLoaded = true;
      for (const src of enhancementScripts) await loadOne(src);
    };
    const waitForShell = () => {
      let tries = 0;
      const timer = setInterval(async () => {
        tries += 1;
        if (document.querySelector('.gc-shell')) {
          clearInterval(timer);
          setTimeout(loadEnhancements, 350);
        } else if (tries >= 120) {
          clearInterval(timer);
        }
      }, 100);
    };
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', waitForShell, { once: true });
    } else {
      waitForShell();
    }
  })();
  </script>
</body>
</html>
