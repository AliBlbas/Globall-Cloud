<!doctype html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Globall Cloud public shipment tracking">
<title>Globall Cloud — Tracking</title>
<style>
:root{--bg:#04101d;--panel:#0a2138;--line:#24517a;--text:#f6fbff;--muted:#9bb6cf;--cyan:#19c8e5;--mint:#62e9b6;--warn:#ffd77d}*{box-sizing:border-box}body{margin:0;background:radial-gradient(900px 500px at 90% -10%,rgba(25,200,229,.16),transparent 70%),var(--bg);color:var(--text);font-family:Vazirmatn,Arial,sans-serif}.wrap{width:min(1050px,100%);margin:auto;padding:22px 14px 50px}.hero{display:flex;justify-content:space-between;gap:14px;align-items:center;margin-bottom:16px}.brand{display:flex;gap:10px;align-items:center}.logo{width:48px;height:48px;display:grid;place-items:center;border-radius:14px;background:linear-gradient(145deg,#fff0b0,#d89b38 60%,#8f551b);color:#1a1105;font-weight:900}.card{background:linear-gradient(155deg,rgba(14,45,72,.94),rgba(4,15,28,.98));border:1px solid rgba(126,195,232,.16);border-radius:22px;padding:16px;box-shadow:0 25px 70px rgba(0,0,0,.32)}.form{display:grid;grid-template-columns:1fr auto;gap:9px}.input{width:100%;padding:13px;border-radius:12px;border:1px solid var(--line);background:#03111f;color:#fff;font:700 14px monospace}.btn{border:0;border-radius:12px;padding:12px 18px;background:linear-gradient(135deg,#9cf0f7,#19c8e5);color:#04141b;font-weight:900}.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin-top:13px}.metric{padding:12px;border:1px solid rgba(126,195,232,.12);border-radius:14px;background:rgba(255,255,255,.025)}.metric span{display:block;color:var(--muted);font-size:10px}.metric strong{display:block;margin-top:6px;font-size:17px}.timeline{display:grid;gap:8px;margin-top:14px}.event{display:grid;grid-template-columns:16px 1fr auto;gap:10px;align-items:start;padding:12px;border:1px solid rgba(126,195,232,.1);border-radius:14px;background:rgba(255,255,255,.025)}.dot{width:10px;height:10px;border-radius:50%;background:var(--mint);margin-top:5px;box-shadow:0 0 0 5px rgba(98,233,182,.08)}.event b{display:block}.event small{color:var(--muted)}.map{margin-top:14px;overflow:hidden;border-radius:16px;border:1px solid rgba(126,195,232,.12);background:#071a2d;min-height:320px}.map iframe{width:100%;height:320px;border:0}.note{color:var(--muted);line-height:1.8}.err{margin-top:12px;color:#ffb8c0}.photos{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.photos img{width:92px;height:92px;object-fit:cover;border-radius:11px;border:1px solid var(--line)}
@media(max-width:700px){.form{grid-template-columns:1fr}.summary{grid-template-columns:1fr 1fr}.event{grid-template-columns:14px 1fr}.event small{display:block;margin-top:3px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero"><div class="brand"><div class="logo">GC</div><div><strong>Globall Cloud</strong><div style="color:var(--muted);font-size:11px">Shipment Tracking</div></div></div><a href="/" style="color:var(--muted)">گەڕانەوە</a></div>
  <div class="card">
    <h2 style="margin:0 0 5px">بارەکەت بە ڕاستەوخۆ ببینە</h2><div class="note">GC code ـەکەت بنووسە، بۆ نموونە <b>GC-1005</b>.</div>
    <div class="form"><input id="code" class="input" placeholder="GC-1005" autocomplete="off"><button id="go" class="btn">Track</button></div><div id="err" class="err"></div>
    <div id="result" hidden></div>
  </div>
</div>
<script>
const API='https://ahslifnthiwfkmaswjno.supabase.co/functions/v1/public-track';
const $=s=>document.querySelector(s);const code=$('#code'),go=$('#go'),result=$('#result'),err=$('#err');
const esc=v=>String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));
const fmtDate=v=>v?new Date(v).toLocaleString('ku-IQ',{dateStyle:'medium',timeStyle:'short'}):'—';
function mapUrl(s){const lat=Number(s.current_lat??s.dest_lat??s.origin_lat);const lng=Number(s.current_lng??s.dest_lng??s.origin_lng);if(!Number.isFinite(lat)||!Number.isFinite(lng))return null;const d=.08;const left=lng-d,right=lng+d,bottom=lat-d,top=lat+d;return `https://www.openstreetmap.org/export/embed.html?bbox=${left}%2C${bottom}%2C${right}%2C${top}&layer=mapnik&marker=${lat}%2C${lng}`}
function render(data){const s=data.shipment||{};const events=[...(data.events||[])].sort((a,b)=>new Date(a.occurred_at||0)-new Date(b.occurred_at||0));const steps=events.length?events.map(e=>`<div class="event"><div class="dot"></div><div><b>${esc(e.title||e.status_key||'Update')}</b><div class="note">${esc(e.note||e.location_label||'')}</div>${Array.isArray(e.photos)&&e.photos.length?`<div class="photos">${e.photos.map(p=>`<img loading="lazy" src="${esc(p)}" alt="Shipment evidence">`).join('')}</div>`:''}</div><small>${fmtDate(e.occurred_at)}</small></div>`).join(''):`<div class="note">هێشتا public tracking event زیاد نەکراوە.</div>`;const map=mapUrl(s);result.hidden=false;result.innerHTML=`<div class="summary"><div class="metric"><span>GC</span><strong>${esc(data.customer_code||'—')}</strong></div><div class="metric"><span>دۆخ</span><strong>${esc(s.operational_status||s.transport_mode||'tracking')}</strong></div><div class="metric"><span>شوێنی ئێستا</span><strong>${esc(s.current_location_label||s.dest_key||'—')}</strong></div><div class="metric"><span>ETA</span><strong>${esc(fmtDate(s.eta))}</strong></div></div><div class="card" style="margin-top:13px"><div style="font-weight:900">${esc(s.origin_key||'—')} → ${esc(s.dest_key||'—')}</div><div class="note">${esc(s.type||s.transport_mode||'')} · ${s.weight_kg?esc(s.weight_kg)+' kg':''} ${s.items_count?`· ${esc(s.items_count)} packages`:''}</div><div class="timeline">${steps}</div>${map?`<div class="map"><iframe loading="lazy" src="${map}" title="Shipment map"></iframe></div>`:''}</div>`}
async function run(){const q=code.value.trim().toUpperCase();err.textContent='';result.hidden=true;if(!/^GC-\d{1,6}$/.test(q)){err.textContent='تکایە GC code ـێکی دروست بنووسە.';return}go.disabled=true;go.textContent='پشکنین…';try{const r=await fetch(`${API}?id=${encodeURIComponent(q)}`,{cache:'no-store',headers:{Accept:'application/json'}});const data=await r.json();if(!r.ok)throw new Error(data.error||'Shipment not found');render(data)}catch(e){err.textContent=e.message||'Tracking failed'}finally{go.disabled=false;go.textContent='Track'}}go.addEventListener('click',run);code.addEventListener('keydown',e=>{if(e.key==='Enter')run()});const u=new URLSearchParams(location.search);if(u.get('id')){code.value=u.get('id');run()}
</script>
</body></html>
