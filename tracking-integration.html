<!-- Enhanced Tracking Integration Example -->
<!-- Reference snippet only — NOT a standalone page (no <html>/<head>/<body>,
     relies on functions like showToast() that only exist inside index.html).
     Do not link to this file from anywhere; link to index.html#track instead.

     tracking-enhanced.js + tracking-styles.css are ALREADY wired directly
     into index.html's live #page-track section, so in this project you
     shouldn't need to copy anything from here — this file is kept only as
     documentation of that integration for reference/reuse in another
     project. If that ever stops being true, this is the snippet to copy
     back into index.html's #page-track, after loading tracking-enhanced.js
     and tracking-styles.css there. -->

<div class="tracking-integration-example">
  <!-- Live Map Section -->
  <section class="tracking-section">
    <h2>📍 نەخشەی زیندووی ڕێگا</h2>
    <div id="liveMapContainer" class="live-map-container">
      <!-- Rendered by EnhancedTracking once a shipment ID is tracked -->
    </div>
  </section>

  <!-- Notification Setup -->
  <section class="tracking-section">
    <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 20px;">
      <h2 style="margin: 0;">🔔 ئاگادارکردنەوەی ڕاستەوخۆ</h2>
      <button class="btn btn-small" id="enableNotificationsBtn" data-gc-onclick="enableNotifications()">
        چالاککردنی ئاگادارکردنەوە
      </button>
    </div>
    <p style="color: var(--muted); font-size: 14px;">
      کاتێک باری بارگەکەت گۆڕا، ڕاستەوخۆ ئاگادار دەبیتەوە.
    </p>
  </section>

  <!-- Tracking Details -->
  <section class="tracking-section">
    <h2>📦 وردەکارییەکانی شوێنکەوتن</h2>
    <div id="trackingDetailsContainer">
      <!-- Step timeline rendered by renderTrackingDetails() below -->
    </div>
  </section>
</div>

<style>
.tracking-integration-example {
  max-width: 800px;
  margin: 0 auto;
}

  margin-bottom: 40px;
