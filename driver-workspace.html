<!doctype html><html lang="ckb" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Global Cloud — Driver Workspace</title><link rel="icon" href="logo-icon.png"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js" defer></script><style>:root{font-family:system-ui,sans-serif;background:#06111f;color:#f7fbff}*{box-sizing:border-box}body{margin:0;background:#06111f}main{max-width:920px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:14px 0}.brand{display:flex;gap:10px;align-items:center}.brand img{width:42px;height:42px;object-fit:contain}.muted{color:#8ea7c3}.panel{background:#0c1e33;border:1px solid #244461;border-radius:20px;padding:18px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.job{padding:16px;border-radius:16px;background:#102943;border:1px solid #244461}.btn{border:1px solid #31536f;background:#0d2741;color:#fff;border-radius:12px;padding:11px 14px;font-weight:800;cursor:pointer}.primary{background:#45e5ef;color:#042027;border:0}.danger{border-color:#7b3f4a;color:#ff9fab}.row{display:flex;justify-content:space-between;gap:8px;align-items:center}.tag{display:inline-flex;padding:5px 8px;border-radius:999px;background:#153957;color:#45e5ef;font:800 10px monospace}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.field{width:100%;background:#081a2e;color:#fff;border:1px solid #31536f;border-radius:11px;padding:12px}.hidden{display:none!important}.modal{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:15px}.modalbox{width:min(620px,100%);background:#0c1e33;border:1px solid #31536f;border-radius:20px;padding:18px}.photo{display:block;width:100%;max-height:260px;object-fit:cover;border-radius:14px;margin-top:10px}.step{display:flex;gap:8px;overflow:auto;padding:4px 0}.step b{white-space:nowrap;padding:8px 10px;border-radius:999px;background:#102943;color:#8ea7c3}.step b.active{background:#153f55;color:#45e5ef}@media(max-width:650px){.grid{grid-template-columns:1fr}main{padding:12px}.panel{padding:14px}}</style></head><body><main><div class="top"><div class="brand"><img src="logo-icon-original.png"><div><strong>Global Cloud</strong><div class="muted">DRIVER / DELIVERY WORKSPACE</div></div></div><button id="logout" class="btn danger">دەرچوون</button></div><section id="login" class="panel"><h2>چوونەژوورەوە</h2><p class="muted">تەنها staff ـی active دەتوانێت delivery ـەکان ببینێت.</p><input id="email" class="field" type="email" placeholder="Email"><br><br><input id="password" class="field" type="password" placeholder="Password"><div class="actions"><button id="loginBtn" class="btn primary">چوونەژوورەوە</button></div><div id="msg" class="muted"></div></section><section id="app" class="hidden"><div class="panel"><div class="row"><div><div class="muted">ACTIVE DRIVER</div><h2 id="staffName">—</h2></div><span id="staffRole" class="tag">—</span></div><div class="step"><b id="s-assigned">ASSIGNED</b><b id="s-accepted">ACCEPTED</b><b id="s-picked_up">PICKED UP</b><b id="s-out_for_delivery">OUT FOR DELIVERY</b><b id="s-delivered">DELIVERED</b></div></div><div id="jobs" class="grid"></div></section></main><div id="modal" class="modal hidden"><div class="modalbox"><div class="row"><h2>POD — بەڵگەی گەیاندن</h2><button id="close" class="btn">×</button></div><p id="podShipment" class="muted"></p><input id="receiver" class="field" placeholder="ناوی وەرگر"><br><br><input id="phone" class="field" placeholder="ژمارەی وەرگر"><br><br><textarea id="note" class="field" rows="3" placeholder="تێبینی"></textarea><br><br><input id="photo" class="field" type="file" accept="image/*" capture="environment"><img id="preview" class="photo hidden"><div class="actions"><button id="deliver" class="btn primary">تۆمارکردنی گەیاندن</button></div><div id="podMsg" class="muted"></div></div></div><script>const SUPABASE_URL='https://ahslifnthiwfkmaswjno.supabase.co';const SUPABASE_ANON_KEY='REDACTED_USE_EXISTING_PUBLIC_ANON_KEY';let sb,session,staff,jobs=[];const $=id=>document.getElementById(id);function setMsg(t){$('msg').textContent=t}async function boot(){if(!window.supabase){setTimeout(boot,100);return}sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);const {data:{session:s}}=await sb.auth.getSession();if(s){session=s;await loadStaff();}}async function loadStaff(){const {data,error}=await sb.from('staff').select('*').eq('id',session.user.id).eq('is_active',true).single();if(error||!data){$('login').classList.remove('hidden');setMsg('Staff access required');return}staff=data;$('login').classList.add('hidden');$('app').classList.remove('hidden');$('staffName').textContent=data.full_name||'Staff';$('staffRole').textContent=(data.role||'').toUpperCase();await loadJobs()}async function login(){const {data,error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){setMsg(error.message);return}session=data.session;await loadStaff()}async function loadJobs(){const {data,error}=await sb.from('delivery_assignments').select('id,shipment_id,status,pickup_at,delivered_at,note,shipments:shipment_id(id,customer_name,customer_phone,dest_key,origin_key,eta,current_location_label,priority)').eq('assigned_staff_id',staff.id).order('created_at',{ascending:false});if(error){$('jobs').innerHTML='<div class="panel">'+error.message+'</div>';return}jobs=data||[];renderJobs()}function renderJobs(){ $('jobs').innerHTML=jobs.map(j=>{const s=j.shipments||{};return `<article class="job"><div class="row"><strong>${s.id||j.shipment_id}</strong><span class="tag">${j.status}</span></div><p>${s.customer_name||'—'}</p><p class="muted">${s.origin_key||'—'} → ${s.dest_key||'—'}</p><p class="muted">${s.customer_phone||''}</p><div class="actions">${nextButtons(j)}</div></article>`}).join('')||'<div class="panel">هیچ delivery assignment ـێکی چالاک نییە.</div>'}function nextButtons(j){if(j.status==='assigned')return `<button class="btn primary" onclick="advance('${j.id}','accepted')">وەرگرتن</button>`;if(j.status==='accepted')return `<button class="btn primary" onclick="advance('${j.id}','picked_up')">وەرگرتنی بار</button>`;if(j.status==='picked_up')return `<button class="btn primary" onclick="advance('${j.id}','out_for_delivery')">دەرچوون بۆ گەیاندن</button>`;if(j.status==='out_for_delivery')return `<button class="btn primary" onclick="openPod('${j.id}','${(j.shipment_id||'').replace(/'/g,'')}')">تۆمارکردنی POD</button>`;return ''}async function advance(id,status){const {error}=await sb.rpc('advance_delivery_assignment',{p_assignment_id:id,p_next_status:status,p_note:null});if(error){alert(error.message);return}await loadJobs()}function openPod(id,shipment){$('modal').classList.remove('hidden');$('podShipment').textContent='Shipment: '+shipment;$('modal').dataset.assignment=id}async function completePod(){const id=$('modal').dataset.assignment;const rec=$('receiver').value.trim();if(!rec){$('podMsg').textContent='ناوی وەرگر پێویستە';return}let photoUrl=null;const file=$('photo').files?.[0];if(file){const path=`pod/${staff.id}/${Date.now()}-${file.name.replace(/[^a-zA-Z0-9._-]/g,'_')}`;const up=await sb.storage.from('shipment-photos').upload(path,file,{upsert:true});if(up.error){$('podMsg').textContent=up.error.message;return}photoUrl=sb.storage.from('shipment-photos').getPublicUrl(path).data.publicUrl}const {data,error}=await sb.from('delivery_assignments').select('shipment_id').eq('id',id).single();if(error){$('podMsg').textContent=error.message;return}const {error:e1}=await sb.from('delivery_proofs').upsert({shipment_id:data.shipment_id,delivered_at:new Date().toISOString(),receiver_name:rec,receiver_phone:$('phone').value.trim()||null,photo_urls:photoUrl?[photoUrl]:[],note:$('note').value.trim()||null,created_by:staff.id,updated_at:new Date().toISOString()},{onConflict:'shipment_id'});if(e1){$('podMsg').textContent=e1.message;return}const {error:e2}=await sb.rpc('advance_delivery_assignment',{p_assignment_id:id,p_next_status:'delivered',p_note:$('note').value.trim()||'POD recorded'});if(e2){$('podMsg').textContent=e2.message;return}closePod();await loadJobs()}function closePod(){$('modal').classList.add('hidden');$('receiver').value='';$('phone').value='';$('note').value='';$('photo').value='';$('preview').classList.add('hidden');$('podMsg').textContent=''}$('photo').addEventListener('change',e=>{const f=e.target.files?.[0];if(!f)return;$('preview').src=URL.createObjectURL(f);$('preview').classList.remove('hidden')});$('loginBtn').onclick=login;$('logout').onclick=async()=>{await sb.auth.signOut();location.reload()};$('close').onclick=closePod;$('deliver').onclick=completePod;boot();</script></body></html>
