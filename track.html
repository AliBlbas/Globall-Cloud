<!doctype html><html lang="ckb" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Globall Cloud — Tracking</title><style>body{margin:0;font-family:Arial,sans-serif;background:#061428;color:#edf6ff}.wrap{max-width:1000px;margin:auto;padding:28px 16px}.card{background:#0b1b31;border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:22px;margin-top:16px}form{display:flex;gap:10px}input,button{padding:13px;border-radius:11px;border:1px solid rgba(255,255,255,.15);background:#071426;color:inherit}input{flex:1}button{cursor:pointer;background:#2ad1c5;color:#061428;font-weight:800}.steps{display:grid;gap:10px;margin-top:18px}.step{padding:14px;border-right:4px solid #2ad1c5;background:rgba(255,255,255,.04);border-radius:10px}.map{height:300px;border-radius:16px;background:radial-gradient(circle at 30% 50%,rgba(42,209,197,.2),transparent 30%),radial-gradient(circle at 70% 50%,rgba(80,150,255,.2),transparent 30%),#071426;display:grid;place-items:center;color:#a9bacb}.muted{color:#9eb0c3}.err{color:#ff9c9c}</style></head><body><div class="wrap"><h1>Globall Cloud</h1><p class="muted">Tracking — GC-1005</p><div class="card"><form id="f"><input id="id" placeholder="GC-1005" required><button>Track</button></form></div><div id="out"></div></div><script>const API='https://ahslifnthiwfkmaswjno.supabase.co/functions/v1/public-track';const $=x=>document.getElementById(x),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));$('f').onsubmit=async e=>{e.preventDefault();$('out').innerHTML='<div class="card">Loading…</div>';try{const r=await fetch(API+'?id='+encodeURIComponent($('id').value.trim()),{headers:{apikey:'sb_publishable_M4UtzEbCLwMCd9LanFWw5g_5b7-fWda'}});const d=await r.json();if(!r.ok)throw Error(d.error||'Not found');const s=d.shipment;$('out').innerHTML=`<div class="card"><h2>${esc(d.customer_code||$(`id`).value)}</h2><p>${esc(s.origin_key||'—')} → ${esc(s.dest_key||'—')} · ${esc(s.transport_mode||s.type||'—')}</p><div class="map">Live location: ${esc(s.current_location_label||s.dest_key||'—')}</div><div class="steps">${(d.events||[]).map(x=>`<div class="step"><b>${esc(x.title||x.status_key||'Update')}</b><div>${esc(x.location_label||'')}</div><small>${new Date(x.occurred_at||x.created_at).toLocaleString()}</small></div>`).join('')||'<div class="step">Your shipment is registered. New tracking events will appear here.</div>'}</div><p class="muted">ETA: ${esc(s.eta||'Not available')}</p></div>`}catch(x){$('out').innerHTML='<div class="card err">'+esc(x.message)+'</div>'}};</script></body></html>
