<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پەنێلی بەڕێوەبردنی گشتی</title>
    <!-- فۆنت و شێواز -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body { background: #f4f7fc; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .sidebar { background: #1e2a3a; min-height: 100vh; padding: 20px; color: white; }
        .sidebar h4 { border-bottom: 1px solid #3a4a5a; padding-bottom: 15px; }
        .nav-link { color: #b0c4de; }
        .nav-link:hover, .nav-link.active { color: white; background: #2b3d54; border-radius: 8px; }
        .main-content { padding: 30px; }
        .card { border-radius: 15px; box-shadow: 0 8px 20px rgba(0,0,0,0.05); border: none; margin-bottom: 20px; }
        .badge-notif { background: #e74c3c; color: white; border-radius: 50%; padding: 2px 10px; margin-right: 10px; }
        .list-group-item { border-left: 4px solid transparent; }
        .list-group-item.pending { border-left-color: #f39c12; background: #fff9e6; }
        .table-actions i { cursor: pointer; margin: 0 5px; }
    </style>
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <!-- سایدبار -->
        <div class="col-md-2 sidebar">
            <h4><i class="bi bi-cloud"></i> گشتی</h4>
            <hr>
            <div class="nav flex-column nav-pills">
                <a class="nav-link active" data-view="dashboard" href="#"><i class="bi bi-speedometer2"></i> داشبۆرد</a>
                <a class="nav-link" data-view="requests" href="#"><i class="bi bi-bell"></i> داواکارییەکان <span class="badge-notif" id="notifCount">0</span></a>
                <a class="nav-link" data-view="accounts" href="#"><i class="bi bi-people"></i> بەڕێوەبردنی ئەکاونت</a>
                <a class="nav-link" data-view="prices" href="#"><i class="bi bi-tag"></i> نرخەکان</a>
                <a class="nav-link" data-view="settings" href="#"><i class="bi bi-gear"></i> ڕێکخستن</a>
            </div>
            <hr>
            <div class="mt-4 text-muted small">تۆ: <strong>Super Admin</strong></div>
        </div>

        <!-- ناوەڕۆک -->
        <div class="col-md-10 main-content">
            <h2 class="mb-4" id="pageTitle">داشبۆرد</h2>
            
            <!-- ڕووکاری داشبۆرد -->
            <div id="view-dashboard" class="view-content">
                <div class="row">
                    <div class="col-md-4"><div class="card p-3"><h5>چاوەڕوانی وەڵام</h5><h2 id="statPending">0</h2></div></div>
                    <div class="col-md-4"><div class="card p-3"><h5>کۆی ستاف</h5><h2 id="statStaff">0</h2></div></div>
                    <div class="col-md-4"><div class="card p-3"><h5>نرخە گۆڕاوەکان</h5><h2 id="statPrices">0</h2></div></div>
                </div>
                <div class="alert alert-info mt-3">ئاگاداری نوێ: کاتێک داواکارییەک دێت، ژمارەکە لە سایدباردا دەردەکەوێت!</div>
            </div>

            <!-- ڕووکاری داواکارییەکان -->
            <div id="view-requests" class="view-content" style="display:none;">
                <div class="card">
                    <div class="card-header bg-white"><h5>لیستی داواکارییەکان <span id="reqCountBadge" class="badge bg-warning">0</span></h5></div>
                    <div class="card-body" id="requestsList">
                        <!-- لەلایەن جاڤاسکریپتەوە پڕ دەکرێتەوە -->
                    </div>
                </div>
            </div>

            <!-- ڕووکاری ئەکاونتەکان -->
            <div id="view-accounts" class="view-content" style="display:none;">
                <div class="card">
                    <div class="card-header bg-white d-flex justify-content-between">
                        <h5>دروستکردنی ئەکاونتی نوێ</h5>
                        <button class="btn btn-primary btn-sm" onclick="addStaffAccount()"><i class="bi bi-plus"></i> زیادکردن</button>
                    </div>
                    <div class="card-body">
                        <input type="text" id="newStaffName" class="form-control mb-2" placeholder="ناوی ستاف">
                        <input type="email" id="newStaffEmail" class="form-control mb-2" placeholder="ئیمەیڵ">
                        <select id="newStaffRole" class="form-select mb-2"><option>Admin</option><option>Manager</option><option>Viewer</option></select>
                        <div id="staffList" class="mt-3"></div>
                    </div>
                </div>
            </div>

            <!-- ڕووکاری نرخەکان -->
            <div id="view-prices" class="view-content" style="display:none;">
                <div class="card">
                    <div class="card-header bg-white"><h5>بەڕێوەبردنی نرخەکان</h5></div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-4"><input id="priceKey" class="form-control" placeholder="ناوی کاڵا / خزمەتگوزاری"></div>
                            <div class="col-4"><input id="priceValue" class="form-control" placeholder="نرخ (بە دۆلار)"></div>
                            <div class="col-4"><button class="btn btn-success" onclick="savePrice()">تۆمارکردن</button></div>
                        </div>
                        <hr>
                        <div id="priceTable" class="mt-3"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // ========== داتا (بۆ نموونە لە localStorage هەڵدەگیرێت) ==========
    let data = {
        requests: [
            { id: 1, name: 'ڕێبازی کڕیار', type: 'نرخ', detail: 'نرخی پاکەتی Z', status: 'pending', date: '2026-08-29' },
            { id: 2, name: 'ستاف ئەحمەد', type: 'ئەکاونت', detail: 'پێویستی بە مۆڵەتی نوێیە', status: 'pending', date: '2026-08-28' }
        ],
        staffs: [
            { id: 101, name: 'سامان', email: 'saman@site.com', role: 'Admin' }
        ],
        prices: [
            { key: 'پاکەتی A', value: 99 },
            { key: 'پاکەتی B', value: 149 }
        ]
    };

    // بارکردنی داتا لە LocalStorage
    function loadData() {
        const saved = localStorage.getItem('globalCloudData');
        if (saved) {
            try { data = JSON.parse(saved); } catch(e) {}
        } else {
            saveData(); // یەکەم جار دەنووسێت
        }
        updateUI();
    }

    function saveData() {
        localStorage.setItem('globalCloudData', JSON.stringify(data));
        updateUI();
    }

    // نیشاندانی ژمارەی ئاگاداری
    function updateUI() {
        const pending = data.requests.filter(r => r.status === 'pending').length;
        document.getElementById('notifCount').innerText = pending;
        document.getElementById('statPending').innerText = pending;
        document.getElementById('statStaff').innerText = data.staffs.length;
        document.getElementById('statPrices').innerText = data.prices.length;
        document.getElementById('reqCountBadge').innerText = pending;

        renderRequests();
        renderStaffs();
        renderPrices();
    }

    // ========== ڕێنادەری داواکاری ==========
    function renderRequests() {
        const container = document.getElementById('requestsList');
        if (data.requests.length === 0) {
            container.innerHTML = '<div class="text-muted">هیچ داواکارییەک نییە</div>';
            return;
        }
        let html = `<ul class="list-group">`;
        data.requests.forEach(req => {
            const isPending = req.status === 'pending';
            html += `
                <li class="list-group-item ${isPending ? 'pending' : ''} d-flex justify-content-between align-items-center">
                    <div>
                        <strong>${req.name}</strong> - ${req.type} <br>
                        <small>${req.detail} | ${req.date}</small>
                    </div>
                    <div>
                        ${isPending ? `
                            <span class="badge bg-warning">چاوەڕوان</span>
                            <i class="bi bi-check-circle text-success" onclick="respondRequest(${req.id}, 'accept')" title="پەسەندکردن"></i>
                            <i class="bi bi-x-circle text-danger" onclick="respondRequest(${req.id}, 'reject')" title="ڕەتکردنەوە"></i>
                        ` : `<span class="badge bg-secondary">وەڵام دراوە</span>`}
                    </div>
                </li>
            `;
        });
        html += `</ul>`;
        container.innerHTML = html;
    }

    // وەڵامدانەوە بۆ داواکاری
    function respondRequest(id, action) {
        const req = data.requests.find(r => r.id === id);
        if (!req) return;
        if (action === 'accept') {
            req.status = 'accepted';
            alert(`داواکاری بۆ ${req.name} پەسەند کرا! (نرخەکە یان ئەکاونتەکە دەگۆڕدرێت)`);
        } else {
            req.status = 'rejected';
            alert(`داواکاری بۆ ${req.name} ڕەت کرایەوە.`);
        }
        saveData();
    }

    // زیادکردنی ستاف
    function addStaffAccount() {
        const name = document.getElementById('newStaffName').value.trim();
        const email = document.getElementById('newStaffEmail').value.trim();
        const role = document.getElementById('newStaffRole').value;
        if (!name || !email) return alert('تکایە ناو و ئیمەیڵ پڕ بکەوە');
        data.staffs.push({ id: Date.now(), name, email, role });
        // ئەگەر داواکارییەک لەسەر ئەمە بوو، بیڕە بە وەڵامدراو
        const relatedReq = data.requests.find(r => r.email === email && r.status === 'pending');
        if (relatedReq) relatedReq.status = 'accepted';
        saveData();
        document.getElementById('newStaffName').value = '';
        document.getElementById('newStaffEmail').value = '';
        alert('ئەکاونت بە سەرکەوتوویی دروست کرا!');
    }

    function renderStaffs() {
        const container = document.getElementById('staffList');
        if (data.staffs.length === 0) return container.innerHTML = '<div class="text-muted">هیچ ستافێک نییە</div>';
        let html = `<table class="table table-sm"><tr><th>ناو</th><th>ئیمەیڵ</th><th>ڕۆڵ</th></tr>`;
        data.staffs.forEach(s => {
            html += `<tr><td>${s.name}</td><td>${s.email}</td><td>${s.role}</td></tr>`;
        });
        html += `</table>`;
        container.innerHTML = html;
    }

    // نرخەکان
    function savePrice() {
        const key = document.getElementById('priceKey').value.trim();
        const val = parseFloat(document.getElementById('priceValue').value);
        if (!key || isNaN(val)) return alert('تکایە ناو و نرخی دروست بنووسە');
        const existing = data.prices.find(p => p.key === key);
        if (existing) {
            existing.value = val;
        } else {
            data.prices.push({ key, value: val });
        }
        saveData();
        document.getElementById('priceKey').value = '';
        document.getElementById('priceValue').value = '';
        alert('نرخ تۆمار کرا!');
    }

    function renderPrices() {
        const container = document.getElementById('priceTable');
        if (data.prices.length === 0) return container.innerHTML = '<div class="text-muted">هیچ نرخێک دیاری نەکراوە</div>';
        let html = `<table class="table"><tr><th>خزمەتگوزاری</th><th>نرخ ($)</th><th>کردار</th></tr>`;
        data.prices.forEach((p, idx) => {
            html += `<tr>
                <td>${p.key}</td>
                <td>${p.value}</td>
                <td><i class="bi bi-pencil text-primary" onclick="editPrice(${idx})"></i> <i class="bi bi-trash text-danger" onclick="deletePrice(${idx})"></i></td>
            </tr>`;
        });
        html += `</table>`;
        container.innerHTML = html;
    }

    function editPrice(idx) {
        const p = data.prices[idx];
        const newVal = prompt(`نرخی نوێ بۆ "${p.key}" بنووسە:`, p.value);
        if (newVal !== null && !isNaN(parseFloat(newVal))) {
            data.prices[idx].value = parseFloat(newVal);
            saveData();
        }
    }
    function deletePrice(idx) {
        if (confirm('دڵنیای لە سڕینەوەی ئەم نرخە؟')) {
            data.prices.splice(idx, 1);
            saveData();
        }
    }

    // ========== گۆڕینی نێوان پەنجەرەکان (Navigation) ==========
    document.querySelectorAll('.nav-link').forEach(link => {
        link.addEventListener('click', function(e) {
            e.preventDefault();
            document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
            this.classList.add('active');
            const view = this.dataset.view;
            document.querySelectorAll('.view-content').forEach(el => el.style.display = 'none');
            const target = document.getElementById(`view-${view}`);
            if (target) target.style.display = 'block';
            document.getElementById('pageTitle').innerText = this.innerText.trim();
        });
    });

    // چونکە داواکارییەکان لە داتای سەرەتاییدا هەن، نیشانی دەدەین
    loadData();
</script>
</body>
</html>
