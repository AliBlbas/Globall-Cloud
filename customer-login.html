<!doctype html>
<html lang="ckb" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Globall Cloud — چوونەژوورەوەی کڕیار</title>
  <link rel="stylesheet" href="/gc-customer-account-20260923.css?v=20261001-3">
  <link rel="stylesheet" href="/gc-mobile-excellence-20261003.css?v=1">
  <style>
    body{min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 75% -10%,#15395a 0,#061428 52%);color:#f5f9fd;font-family:Vazirmatn,system-ui,sans-serif}.box{width:min(440px,calc(100% - 28px));padding:28px;border:1px solid #214363;border-radius:24px;background:linear-gradient(160deg,#112b49,#0b1e34);box-shadow:0 22px 80px #0005}.brand{display:flex;align-items:center;gap:10px;color:inherit;text-decoration:none;margin-bottom:22px}.brand img{width:42px}.brand small{display:block;color:#92aac7;font-size:10px;letter-spacing:1px}.field{display:block;width:100%;margin:8px 0 14px;padding:13px;border-radius:12px;border:1px solid #214363;background:#081a30;color:#fff;font:inherit;box-sizing:border-box}.btn{width:100%;padding:13px;border:0;border-radius:999px;background:linear-gradient(135deg,#58e5ef,#00c2d9);color:#06222a;font-weight:800;font:inherit;cursor:pointer}.muted{color:#92aac7}.error{color:#ff9d9d}.links{display:flex;justify-content:space-between;gap:12px;margin-top:18px}.links a{color:#58e5ef}
  </style>
</head>
<body>
  <main class="box">
    <a class="brand" href="/"><img src="/logo-icon.png" alt="Globall Cloud"><span><b>Globall Cloud</b><small>CUSTOMER PORTAL</small></span></a>
    <h1>چوونەژوورەوەی کڕیار</h1>
    <p class="muted">بە کۆدی GC و وشەی نهێنییەکەت بچۆ ناو داشبۆرد.</p>
    <form id="loginForm">
      <label>کۆدی GC<input id="code" class="field" placeholder="GC-833" required autocomplete="username"></label>
      <label>وشەی نهێنی<input id="password" class="field" type="password" required autocomplete="current-password"></label>
      <button class="btn" type="submit">چوونەژوورەوە</button>
      <p id="msg" class="muted" aria-live="polite"></p>
    </form>
    <div class="links"><a href="/register">کڕیاری نوێیت؟</a><a href="/">سەرەکی</a></div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const URL='https://ahslifnthiwfkmaswjno.supabase.co',KEY='sb_publishable_M4UtzEbCLwMCd9LanFWw5g_5b7-fWda';
    document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();const m=document.getElementById('msg');m.className='muted';m.textContent='چاوەڕوان بە...';try{const r=await fetch(URL+'/functions/v1/customer-gc-login',{method:'POST',headers:{apikey:KEY,'content-type':'application/json'},body:JSON.stringify({code:document.getElementById('code').value.trim(),password:document.getElementById('password').value})});const b=await r.json();if(!r.ok||!b.session)throw new Error(b.error||'Login failed');const sb=supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true}});const saved=await sb.auth.setSession(b.session);if(saved.error)throw saved.error;location.href='/dashboard'}catch(err){m.className='error';m.textContent=err.message||'Login failed'}});
  </script>
</body>
</html>
