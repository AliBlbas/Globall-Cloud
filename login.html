<!doctype html><html lang="ckb" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Globall Cloud — Login</title><link rel="stylesheet" href="/gc-customer-account-20260923.css?v=20261001-3"><style>body{min-height:100vh;display:grid;place-items:center;background:#061428;color:#f5f9fd;font-family:system-ui,sans-serif}.box{width:min(440px,calc(100% - 28px));padding:26px;border:1px solid #214363;border-radius:22px;background:#0d2039}.field{display:block;width:100%;margin:8px 0 14px;padding:12px;border-radius:12px;border:1px solid #214363;background:#081a30;color:#fff;font:inherit}.btn{width:100%;padding:12px;border:0;border-radius:999px;background:#58e5ef;color:#06222a;font-weight:800;font:inherit}.muted{color:#92aac7}.error{color:#ff9d9d}</style></head><body><main class="box"><h1>چوونەژوورەوەی کڕیار</h1><p class="muted">بە کۆدی GC و وشەی نهێنییەکەت بچۆ ناو داشبۆرد.</p><form id="loginForm"><label>کۆدی GC<input id="code" class="field" placeholder="GC-833" required autocomplete="username"></label><label>وشەی نهێنی<input id="password" class="field" type="password" required autocomplete="current-password"></label><button class="btn">چوونەژوورەوە</button><p id="msg" class="muted" aria-live="polite"></p></form><p><a href="/register.html" class="muted">کڕیاری نوێیت؟ زانیارییەکان بنێرە بۆ staff</a></p><p><a href="/" class="muted">گەڕانەوە بۆ سەرەکی</a></p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const URL='https://ahslifnthiwfkmaswjno.supabase.co',KEY='sb_publishable_M4UtzEbCLwMCd9LanFWw5g_5b7-fWda';document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();const m=document.getElementById('msg');m.textContent='چاوەڕوان بە...';try{const r=await fetch(URL+'/functions/v1/customer-gc-login',{method:'POST',headers:{apikey:KEY,'content-type':'application/json'},body:JSON.stringify({code:document.getElementById('code').value,password:document.getElementById('password').value})});const b=await r.json();if(!r.ok||!b.session)throw new Error(b.error||'Login failed');const sb=supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true}});const saved=await sb.auth.setSession(b.session);if(saved.error)throw saved.error;location.href='/dashboard.html'}catch(err){m.className='error';m.textContent=err.message||'Login failed'}});</script></body></html>
