<!doctype html>
<html lang="ckb" dir="rtl">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#061428"><title>چوونەژوورەوە — Globall Cloud</title>
  <link rel="icon" href="/logo-icon.png"><link rel="stylesheet" href="/customer-auth.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
</head>
<body>
  <main class="auth-shell"><section class="auth-card">
    <a class="brand" href="/"><img src="/logo-icon.png" alt="Globall Cloud"><span><b>Globall Cloud</b><small>CUSTOMER PORTAL</small></span></a>
    <div class="eyebrow">CUSTOMER ACCESS</div><h1>بە کۆدی GC بچۆ ژوورەوە</h1><p class="muted">شوێنی بار، داواکارییەکان، ناونیشانی کۆگا و حسابەکەت لە یەک شوێن ببینە.</p>
    <form id="authForm" class="auth-form"><label for="code">کۆدی GC</label><input id="code" required autocomplete="username" placeholder="GC-338"><label for="password">وشەی نهێنی</label><input id="password" type="password" required autocomplete="current-password"><div id="message" class="auth-message" aria-live="polite"></div><button class="primary" type="submit">چوونەژوورەوە</button></form>
    <p class="switch">هەژمارت نییە؟ <a href="/register.html">هەژماری نوێ دروست بکە</a></p><a class="back" href="/">← گەڕانەوە بۆ سەرەکی</a>
  </section></main><script src="/customer-auth.js" defer></script>
</body>
</html>
