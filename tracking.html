<!doctype html><html lang="ku" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Global Cloud shipment tracking"><title>Tracking | Global Cloud</title><link rel="stylesheet" href="/assets/css/shop.css"><style>body{background:#061428;color:#f6fbff}.track-shell{max-width:980px;margin:30px auto;padding:0 14px}.track-card{border:1px solid rgba(126,195,232,.16);border-radius:22px;background:linear-gradient(145deg,#0c2b49,#04111f);padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.28)}.track-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.track-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:12px;margin-top:12px}.track-panel{border:1px solid rgba(126,195,232,.12);border-radius:16px;padding:14px;background:rgba(255,255,255,.025)}.track-panel h3{margin:0 0 9px;font-size:14px}.track-meta{color:#9db6d3;font-size:11px;line-height:1.8}.track-status{display:inline-flex;padding:7px 10px;border-radius:999px;background:rgba(88,230,176,.1);color:#a9f2d0;font-weight:900;font-size:10px}.timeline{display:grid;gap:8px}.event{position:relative;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06)}.event b{font-size:11px}.event small{display:block;color:#7897b4;font-size:9px;margin-top:3px}.map{width:100%;min-height:330px;border:0;border-radius:14px;background:#0a1d31}.route-line{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}.hub{padding:7px 9px;border-radius:10px;background:rgba(139,234,246,.08);color:#b9f8ff;font-weight:800;font-size:10px}.arrow{color:#7f9bb6}.photo-row{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.photo-row img{width:74px;height:74px;object-fit:cover;border-radius:10px;border:1px solid rgba(255,255,255,.08)}@media(max-width:760px){.track-grid{grid-template-columns:1fr}.track-shell{margin:16px auto}.track-card{padding:13px}}</style></head><body><main class="track-shell"><section class="track-card"><div class="track-head"><div><div style="color:#8beaf6;font:700 10px monospace;letter-spacing:2px">GLOBAL CLOUD · LIVE TRACKING</div><h1 style="margin:6px 0 4px">شوێنی بارەکەت</h1><p style="margin:0;color:#9db6d3;font-size:12px">GC code یان tracking ID بنووسە و دۆخی بارەکەت بە timeline و map ببینە.</p></div><div id="updated" class="track-meta">—</div></div><div class="form-grid" style="margin-top:15px"><div><label for="trackingId">GC / Tracking ID</label><input id="trackingId" type="text" placeholder="GC-1005 یان GC-SHOP-..." autocomplete="off"></div><div style="display:flex;align-items:end"><button id="trackBtn" style="width:100%">شوێنەکە ببینە</button></div></div><div id="result" style="margin-top:14px"></div></section></main><script type="module">import {initLayout} from '/assets/js/layout.js';import {supabase} from '/assets/js/supabase.js';await initLayout('shipments');const idInput=document.getElementById('trackingId'),btn=document.getElementById('trackBtn'),result=document.getElementById('result'),updated=document.getElementById('updated');const U='https://ahslifnthiwfkmaswjno.supabase.co',K='sb_publishable_M4UtzEbCLwMCd9LanFWw5g_5b7-fWda';const params=new URLSearchParams(location.search);idInput.value=params.get('id')||'';const esc=v=>String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));const fmtDate=v=>v?new Intl.DateTimeFormat('ku-IQ',{dateStyle:'medium',timeStyle:'short'}).format(new Date(v)):'—';const mapUrl=(s)=>{const pts=[];for(const p of [[s.current_lat,s.current_lng],[s.origin_lat,s.origin_lng],[s.dest_lat,s.dest_lng]])if(Number.isFinite(Number(p[0]))&&Number.isFinite(Number(p[1])))pts.push([Number(p[1]),Number(p[0])]);if(!pts.length)return null;const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]);const pad=.03;const minx=Math.min(...xs)-pad,maxx=Math.max(...xs)+pad,miny=Math.min(...ys)-pad,maxy=Math.max(...ys)+pad;return `https://www.openstreetmap.org/export/embed.html?bbox=${encodeURIComponent(`${minx},${miny},${maxx},${maxy}`)}&layer=mapnik`};
const run=async()=>{const id=idInput.value.trim();if(!id){result.innerHTML='<div class="track-meta">GC code دابنێ.</div>';return}btn.disabled=true;btn.textContent='پشکنین...';try{const session=(await supabase.auth.getSession()).data.session;const h={apikey:K,Accept:'application/json'};if(session?.access_token)h.Authorization=`Bearer ${session.access_token}`;const r=await fetch(`${U}/functions/v1/public-track?id=${encodeURIComponent(id)}`,{headers:h,cache:'no-store'});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Shipment not found');const s=d.shipment||{};const labels={pending:'چاوەڕێی وەرگرتن',in_transit:'لە ڕێگادایە',delivered:'گەیشتووە',completed:'تەواوبووە'};const events=(d.events||[]).slice().sort((a,b)=>new Date(b.occurred_at||b.created_at||0)-new Date(a.occurred_at||a.created_at||0));const map=mapUrl(s);const gallery=[...(s.step_photos||[]),...(events.flatMap(e=>Array.isArray(e.photos)?e.photos:[]))].slice(0,8);result.innerHTML=`<div class="track-panel"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><div><div class="track-meta">Tracking</div><strong style="font-family:monospace;font-size:16px">${esc(d.customer_code||s.id)}</strong></div><span class="track-status">${esc(labels[s.operational_status]||s.operational_status||'Tracking')}</span></div><div class="route-line"><span class="hub">${esc(s.origin_key||'—')}</span><span class="arrow">←→</span><span class="hub">${esc(s.current_location_label||'لە ڕێگا')}</span><span class="arrow">←→</span><span class="hub">${esc(s.dest_key||'—')}</span></div><div class="track-meta" style="margin-top:8px">${s.eta?`ETA: ${esc(fmtDate(s.eta))} · `:''}${s.tracking_updated_at?`نوێکراوەتەوە: ${esc(fmtDate(s.tracking_updated_at))}`:''}</div></div><div class="track-grid"><div class="track-panel"><h3>Timeline ـی بارەکە</h3><div class="timeline">${events.map(e=>`<div class="event"><b>${esc(e.title||e.status_key||'Update')}</b><small>${esc(e.location_label||'')} · ${esc(fmtDate(e.occurred_at||e.created_at))}</small>${e.note?`<div class="track-meta" style="margin-top:4px">${esc(e.note)}</div>`:''}</div>`).join('')||'<div class="track-meta">هێشتا event ـێکی public تۆمار نەکراوە.</div>'}</div>${gallery.length?`<div class="photo-row">${gallery.map(p=>`<img src="${esc(p)}" alt="Shipment evidence" loading="lazy">`).join('')}</div>`:''}</div><div class="track-panel"><h3>نەخشە</h3>${map?`<iframe class="map" loading="lazy" title="Shipment map" src="${map}"></iframe>`:'<div class="track-meta">شوێنی GPS بۆ ئەم بارە بەردەست نییە.</div>'}</div></div>`;updated.textContent=s.tracking_updated_at?fmtDate(s.tracking_updated_at):''}catch(e){result.innerHTML=`<div class="track-meta">${esc(e.message)}</div>`}finally{btn.disabled=false;btn.textContent='شوێنەکە ببینە'}};btn.addEventListener('click',run);idInput.addEventListener('keydown',e=>{if(e.key==='Enter')run()});if(idInput.value)run();</script></body></html>
