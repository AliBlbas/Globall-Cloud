<!doctype html><html lang="ku" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Global Cloud shipment tracking"><title>Tracking | Global Cloud</title><link rel="stylesheet" href="/assets/css/shop.css"></head><body><main class="container" style="max-width:900px"><h1>📍 Tracking</h1><p>دۆخی shipment ـەکەت بە ڕاستەوخۆ ببینە.</p><div class="card"><div class="form-grid"><div><label for="trackingId">Tracking ID</label><input id="trackingId" type="text" placeholder="GC-SHOP-..." autocomplete="off"></div><div style="display:flex;align-items:end"><button id="trackBtn" style="width:100%">Track Shipment</button></div></div><div id="result" style="margin-top:18px"></div></div></main><script type="module">import {initLayout} from '/assets/js/layout.js';import {supabase} from '/assets/js/supabase.js';await initLayout('shipments');const idInput=document.getElementById('trackingId'),btn=document.getElementById('trackBtn'),result=document.getElementById('result');const SUPABASE_URL='https://ahslifnthiwfkmaswjno.supabase.co';const SUPABASE_KEY='sb_publishable_M4UtzEbCLwMCd9LanFWw5g_5b7-fWda';const params=new URLSearchParams(location.search);idInput.value=params.get('id')||'';const labels={pending:'چاوەڕێ',in_transit:'لە ڕێگادایە',delivered:'گەیشتووە'};async function run(){const id=idInput.value.trim();if(!id){result.innerHTML='<div class="page-note">Tracking ID دابنێ.</div>';return}btn.disabled=true;btn.textContent='پشکنین...';try{const session=(await supabase.auth.getSession()).data.session;const headers={apikey:SUPABASE_KEY,Accept:'application/json'};if(session?.access_token)headers.Authorization=`Bearer ${session.access_token}`;const r=await fetch(`${SUPABASE_URL}/functions/v1/public-track?id=${encodeURIComponent(id)}`,{headers,cache:'no-store'});const data=await r.json();if(!r.ok)throw new Error(data.error||'Shipment not found');const s=data.shipment||{};result.innerHTML=`<div class="order-card"><strong>Shipment #${s.id}</strong><div class="status">${labels[s.operational_status]||s.operational_status||'Tracking'}</div><div style="margin-top:12px">📍 ${s.current_location_label||s.dest_key||'—'}</div><div class="order-meta">${s.origin_key||'—'} → ${s.dest_key||'—'}</div>${s.eta?`<div style="margin-top:8px">ETA: ${new Date(s.eta).toLocaleString('ku-IQ')}</div>`:''}</div>`}catch(e){result.innerHTML=`<div class="page-note">${e.message}</div>`}finally{btn.disabled=false;btn.textContent='Track Shipment'}}btn.addEventListener('click',run);if(idInput.value)run();</script></body></html>
