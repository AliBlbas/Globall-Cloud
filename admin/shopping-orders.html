<!doctype html><html lang="ku" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin - Shopping Orders | Global Cloud</title><link rel="stylesheet" href="/assets/css/style.css"></head><body><main class="container" style="max-width:1200px;margin:40px auto;padding:24px"><h1>👑 Admin - Shopping Orders → Shipments</h1><div id="message"></div><div style="overflow:auto"><table class="w-full border"><thead><tr><th>Order</th><th>Product</th><th>Price / Status</th><th>Action</th></tr></thead><tbody id="adminTable"><tr><td colspan="4">Loading...</td></tr></tbody></table></div></main><script type="module">import {supabase} from '/assets/js/supabase.js';import {initLayout} from '/assets/js/layout.js';await initLayout('admin');const msg=document.getElementById('message'),table=document.getElementById('adminTable');const {data:{user}}=await supabase.auth.getUser();if(!user){location.replace('/login.html?next=/admin/shopping-orders.html');throw new Error('Not authenticated');}const {data:isAdmin,error:adminError}=await supabase.rpc('is_admin');if(adminError||!isAdmin){msg.textContent='تۆ دەسەڵاتی Admin ـت نییە.';setTimeout(()=>location.replace('/shop/orders.html'),700);throw new Error('Not admin');}async function load(){const {data,error}=await supabase.from('shopping_orders').select('*, shopping_order_items(*), shipments(id,tracking_number,status)').order('created_at',{ascending:false});if(error){table.innerHTML=`<tr><td colspan="4">هەڵە: ${error.message}</td></tr>`;return;}table.innerHTML=(data||[]).map(o=>{const item=o.shopping_order_items?.[0],s=o.shipments;const actions={paid:`<button data-id="${o.id}" data-status="ordered_from_platform">Paid → Ordered</button>`,ordered_from_platform:`<button data-id="${o.id}" data-status="arrived_at_origin_warehouse">→ Origin Warehouse</button>`,arrived_at_origin_warehouse:`<button data-id="${o.id}" data-status="shipped_to_erbil">→ Shipped to Erbil + Shipment</button>`,shipped_to_erbil:`<button data-id="${o.id}" data-status="delivered">→ Delivered</button>`};return `<tr><td>${o.id.slice(0,8)}<br>${new Date(o.created_at).toLocaleString()}</td><td><a href="${item?.product_url||'#'}" target="_blank" rel="noopener">SHEIN Link</a><br>${item?.product_price_usd??0}$ + ${item?.product_shipping_usd??0}$</td><td><b>${Number(o.final_price_iqd||0).toLocaleString()} IQD</b><br>${o.status}<br>${s?`Shipment: ${s.tracking_number||s.id}`:''}</td><td>${actions[o.status]||'—'}</td></tr>`}).join('')||'<tr><td colspan="4">هیچ order ـێک نییە.</td></tr>';table.querySelectorAll('button[data-status]').forEach(b=>b.addEventListener('click',async()=>{if(!confirm(`دڵنیایت؟`))return;b.disabled=true;const {error}=await supabase.rpc('admin_update_shopping_status',{p_order_id:b.dataset.id,p_new_status:b.dataset.status});if(error)alert(error.message);else await load();}));}load();</script></body></html>
