<!doctype html><html lang="ku" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin - Shopping Orders | Global Cloud</title><link rel="stylesheet" href="/assets/css/shop.css"></head><body><main class="container" style="max-width:1200px"><h1>👑 Shopping Orders → Shipments</h1><p>داواکارییە پارەدراوەکان بە شێوەیەکی ڕاستەوخۆ بەرەو خرید، وەرهاوس، گواستنەوە و delivery بەڕێوە دەبرێن.</p><div id="message"></div><div style="overflow:auto"><table><thead><tr><th>Order</th><th>Product</th><th>Price / Status</th><th>Operations</th></tr></thead><tbody id="adminTable"><tr><td colspan="4">Loading...</td></tr></tbody></table></div></main><script type="module">import {supabase} from '/assets/js/supabase.js';import {initLayout} from '/assets/js/layout.js';await initLayout('admin');const msg=document.getElementById('message'),table=document.getElementById('adminTable');const labels={pending_payment:'چاوەڕوانی پارەدان',paid:'پارە دراوە',ordered_from_platform:'لە SHEIN کڕدراوە',arrived_at_origin_warehouse:'گەیشتووە بە وەرهاوس',shipped_to_erbil:'نێردراوە بۆ هەولێر',delivered:'گەیشتووە',cancelled:'هەڵوەشێنراوەتەوە'};const {data:{user}}=await supabase.auth.getUser();if(!user){location.replace('/login.html?next=/admin/shopping-orders.html');throw new Error('Not authenticated')}const {data:isAdmin,error:ae}=await supabase.rpc('is_admin');if(ae||!isAdmin){msg.innerHTML='<div class="page-note">تۆ دەسەڵاتی Admin ـت نییە.</div>';setTimeout(()=>location.replace('/shop/orders.html'),700);throw new Error('Not admin')}async function load(){const {data,error}=await supabase.from('shopping_orders').select('id,created_at,final_price_iqd,status,shipment_id,tracking_number,shopping_order_items(product_url,product_price_usd,product_shipping_usd,quantity),payment_sessions(status),shipments(id,operational_status)').order('created_at',{ascending:false});if(error){table.innerHTML=`<tr><td colspan="4">هەڵە: ${error.message}</td></tr>`;return}table.innerHTML=(data||[]).map(o=>{const item=o.shopping_order_items?.[0],s=o.shipments;const action={paid:['ordered_from_platform','Paid → Ordered'],ordered_from_platform:['arrived_at_origin_warehouse','→ Origin Warehouse'],arrived_at_origin_warehouse:['shipped_to_erbil','→ Shipped to Erbil'],shipped_to_erbil:['delivered','→ Delivered']}[o.status];return `<tr><td><strong>#${o.id.slice(0,8)}</strong><div class="order-meta">${new Date(o.created_at).toLocaleString('ku-IQ')}</div></td><td><a href="${item?.product_url||'#'}" target="_blank" rel="noopener">SHEIN Link</a><div class="order-meta">${item?.product_price_usd??0}$ + ${item?.product_shipping_usd??0}$ × ${item?.quantity??1}</div></td><td><strong>${Number(o.final_price_iqd||0).toLocaleString()} IQD</strong><div class="status ${o.status}">${labels[o.status]||o.status}</div>${s?`<div class="order-meta">Shipment: ${s.id}</div><div class="order-meta">${s.operational_status||''}</div>`:''}</td><td>${action?`<button data-id="${o.id}" data-status="${action[0]}">${action[1]}</button>`:'—'}</td></tr>`}).join('')||'<tr><td colspan="4">هیچ order ـێک نییە.</td></tr>';table.querySelectorAll('button[data-status]').forEach(b=>b.addEventListener('click',async()=>{if(!confirm('دڵنیایت لە گۆڕینی status؟'))return;b.disabled=true;const {error}=await supabase.rpc('admin_update_shopping_status',{p_order_id:b.dataset.id,p_new_status:b.dataset.status});if(error){alert(error.message);b.disabled=false}else await load()}))}load();</script></body></html>
